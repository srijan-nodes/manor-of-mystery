<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manor of Whispers - Local LLM Detective Game</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Font: Special Elite for Detective Vibes -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
        }
        .font-typewriter {
            font-family: 'Special Elite', cursive;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICONS (Defined inline to avoid external dependency errors) ---
        const Icons = {
            ShieldAlert: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Cpu: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1V4"/><path d="M15 1V4"/><path d="M9 20V23"/><path d="M15 20V23"/><path d="M20 9H23"/><path d="M20 14H23"/><path d="M1 9H4"/><path d="M1 14H4"/></svg>,
            Zap: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Loader2: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            AlertTriangle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            BookOpen: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Send: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Search: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            User: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            MapPin: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        };

        const { Search, User, MapPin, BookOpen, Send, Loader2, AlertTriangle, ShieldAlert, Cpu, Zap } = Icons;

        // --- GAME CONFIGURATION ---
        // We use Llama-3.2-3B-Instruct for a good balance of speed (WebGPU) and roleplay capability.
        // Approx download: 2.2GB.
        const MODEL_ID = "Llama-3.2-3B-Instruct-q4f16_1-MLC";

        const CHARACTERS = [
        {
            id: 'vivian',
            name: 'Lady Vivian',
            role: 'The Widow',
            avatar: 'bg-purple-900',
            desc: 'Arthur\'s wife. Haughty, defensive, and seemingly unbothered by her husband\'s death.',
            systemPrompt: `
                You are Lady Vivian Pennyworth. You are the MURDERER. 
                You killed Arthur because he discovered your affair with Thomas and was planning to disinherit you tomorrow morning.

                Guidelines:
                1. You claim you were in the rose garden alone at 10 PM.
                2. If asked about the affair or "Thomas", admit to the romance but swear you loved Arthur too much to hurt him.
                3. You are trying to frame Robert. Mention that Arthur and Robert had a "violent shouting match" about money earlier that evening.
                4. CRITICAL: You will only confess to the murder if the detective mentions the "Revised Will" or "Poisoned Sherry". 
                5. Keep responses concise (under 3 sentences).
            `
        },
        {
            id: 'james',
            name: 'James',
            role: 'The Butler',
            avatar: 'bg-slate-700',
            desc: 'The loyal family butler. Nervous, fidgety, and knows more than he lets on.',
            systemPrompt: `
                You are James, the nervous butler. You are innocent, but terrified because you saw something you shouldn't have.
                
                Guidelines:
                1. You are very respectful ("Sir" or "Detective") but your hands shake (mention this in descriptions).
                2. If asked about the night of the murder, say you were cleaning the dining hall.
                3. CRITICAL: You saw Lady Vivian cleaning a dark stain off her silk dress at 11 PM. You will only reveal this if the detective asks about "the dress", "stains", or "Vivian's behavior".
                4. If the detective mentions "Thomas", you whisper that you saw them arguing near the shed.
                5. Keep responses concise.
            `
        },
        {
            id: 'robert',
            name: 'Robert Sterling',
            role: 'The Partner',
            avatar: 'bg-amber-900',
            desc: 'Arthur\'s business partner. Confident, arrogant, and aggressive.',
            systemPrompt: `
                You are Robert Sterling. You are innocent of murder, but you ARE guilty of embezzling funds.
                Because of your theft, you are acting extremely guilty and suspicious.

                Guidelines:
                1. Be aggressive. Tell the detective to stop wasting your time.
                2. Claim you were in the study with Arthur until 9:30 PM, then went straight to your hotel.
                3. If the detective mentions "money" or "theft", get very defensive and threaten to call your lawyer.
                4. You suspect Vivian. You saw her hiding a small glass vial in the grandfather clock. You will only mention the "Vial" or "Grandfather Clock" if the detective asks about "hidden items" or "the clock".
                5. Mock the detective's intelligence frequently.
            `
        }
];
        // --- MOCK ENGINE (LITE MODE) ---
        // This simulates AI behavior for users without WebGPU or who want instant loading.
        class MockEngine {
            constructor() {
                this.chat = {
                    completions: {
                        create: async ({ messages }) => {
                            // Simulate network delay
                            await new Promise(r => setTimeout(r, 1000));
                            
                            const lastMsg = messages[messages.length - 1].content.toLowerCase();
                            const systemMsg = messages[0].content;
                            let reply = "";

                            // Logic to determine which character we are talking to based on system prompt snippets
                            if (systemMsg.includes("Vivian")) {
                                if (lastMsg.match(/thomas|garden|affair|muddy/)) {
                                    reply = "How dare you! ...Fine. Yes, I was with Thomas in the garden. We are lovers! But I swear I didn't kill Arthur. I was with Thomas at 11 PM!";
                                } else if (lastMsg.match(/husband|arthur|kill|murder/)) {
                                    reply = "I didn't kill him. Our marriage was cold, yes, but murder? Don't be absurd. Ask his shady partner, Robert.";
                                } else {
                                    reply = "I don't see how that concerns me. I was taking a walk. Alone. Now leave me be.";
                                }
                            } else if (systemMsg.includes("James")) {
                                if (lastMsg.match(/robert|argue|fight|visitor|study/)) {
                                    reply = "O-oh dear... you know? Yes... Mr. Sterling was here. I saw him leave the study at 10:45 PM. He looked f-furious. Please don't tell him I told you!";
                                } else if (lastMsg.match(/kill|murder/)) {
                                    reply = "I would never hurt Mr. Pennyworth! I was polishing the silver! Please, Sir, believe me.";
                                } else {
                                    reply = "I-I don't know anything, Sir. I was just doing my duties. Just... doing my duties.";
                                }
                            } else if (systemMsg.includes("Robert")) {
                                if (lastMsg.match(/embezzle|money|steal|ledger|fraud/)) {
                                    reply = "The ledger? You found the... No! That proves nothing! Arthur was ruining the company! He had to be stopped!";
                                } else if (lastMsg.match(/james|butler/)) {
                                    reply = "James? That senile old fool? He's practically blind. If he says he saw me, he's lying.";
                                } else {
                                    reply = "I have a business to run, Detective. I was at my club in the city all night. Verify it if you must (you can't).";
                                }
                            }

                            return {
                                choices: [{
                                    message: { content: reply }
                                }]
                            };
                        }
                    }
                };
            }
        }

        // --- COMPONENTS ---

        function LoadingScreen({ progress, error, onStart, onStartLite }) {
            return (
                <div className="fixed inset-0 bg-zinc-900 flex flex-col items-center justify-center p-6 z-50 text-center">
                    <div className="max-w-md w-full space-y-8">
                        <div>
                            <h1 className="text-4xl font-typewriter text-amber-500 mb-2 tracking-widest">MANOR OF WHISPERS</h1>
                            <p className="text-zinc-500">Local LLM Detective Experience</p>
                        </div>

                        {!progress && !error && (
                            <div className="bg-zinc-800 p-6 rounded-lg border border-zinc-700 shadow-xl space-y-4">
                                <div>
                                    <ShieldAlert className="w-12 h-12 text-amber-500 mx-auto mb-4" />
                                    <h3 className="text-xl font-bold text-white mb-2">Select Engine</h3>
                                    <p className="text-zinc-400 text-sm">
                                        Choose your experience below.
                                    </p>
                                </div>
                                
                                <button 
                                    onClick={onStart}
                                    className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded transition-all flex items-center justify-center gap-2"
                                >
                                    <Cpu size={20} />
                                    Full AI Mode (Downloads ~2.2GB)
                                </button>
                                
                                <div className="relative flex py-2 items-center">
                                    <div className="flex-grow border-t border-zinc-600"></div>
                                    <span className="flex-shrink mx-4 text-zinc-500 text-xs">OR</span>
                                    <div className="flex-grow border-t border-zinc-600"></div>
                                </div>

                                <button 
                                    onClick={onStartLite}
                                    className="w-full bg-zinc-700 hover:bg-zinc-600 text-zinc-200 font-bold py-3 px-4 rounded transition-all flex items-center justify-center gap-2"
                                >
                                    <Zap size={20} />
                                    Lite Mode (Instant Load, Mock AI)
                                </button>
                                <p className="text-[10px] text-zinc-500">Lite mode uses scripted logic instead of a real neural network.</p>
                            </div>
                        )}

                        {progress > 0 && !error && (
                            <div className="space-y-4">
                                <div className="flex justify-between text-sm text-zinc-400">
                                    <span>Downloading Neural Weights...</span>
                                    <span>{Math.round(progress * 100)}%</span>
                                </div>
                                <div className="h-2 bg-zinc-800 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full bg-amber-600 transition-all duration-300" 
                                        style={{ width: `${progress * 100}%` }}
                                    ></div>
                                </div>
                                <p className="text-xs text-zinc-600 font-mono">Loading: {MODEL_ID}</p>
                                <div className="flex justify-center mt-4">
                                    <Loader2 className="animate-spin text-amber-600" size={32} />
                                </div>
                            </div>
                        )}

                        {error && (
                            <div className="bg-red-900/20 border border-red-500/50 p-4 rounded-lg text-red-200">
                                <AlertTriangle className="mx-auto mb-2" />
                                <p>{error}</p>
                                <button 
                                    onClick={() => window.location.reload()}
                                    className="mt-4 text-sm underline hover:text-white"
                                >
                                    Reload Page
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ChatMessage({ message, charName }) {
            const isUser = message.role === 'user';
            return (
                <div className={`flex w-full mb-4 ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                    <div className={`max-w-[80%] flex flex-col ${isUser ? 'items-end' : 'items-start'}`}>
                        <span className="text-xs text-zinc-500 mb-1 font-typewriter">
                            {isUser ? 'Detective Srijan' : charName}
                        </span>
                        <div className={`px-4 py-3 rounded-2xl shadow-md text-sm leading-relaxed ${
                            isUser 
                                ? 'bg-amber-700 text-white rounded-tr-sm' 
                                : 'bg-zinc-800 text-zinc-200 border border-zinc-700 rounded-tl-sm'
                        }`}>
                            {message.content}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [engine, setEngine] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [error, setError] = useState(null);
            const [isReady, setIsReady] = useState(false);
            const [mode, setMode] = useState(null); // 'full' or 'lite'

            const [activeCharId, setActiveCharId] = useState('vivian');
            const [conversations, setConversations] = useState({
                vivian: [],
                james: [],
                robert: []
            });
            const [userInput, setUserInput] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);

            const chatEndRef = useRef(null);

            // --- ENGINE INITIALIZATION ---
            const initEngine = async () => {
                setIsLoading(true);
                setError(null);
                setMode('full');
                
                try {
                    if (!navigator.gpu) {
                        throw new Error("WebGPU is not supported. Please use Lite Mode.");
                    }

                    const initProgressCallback = (report) => {
                        console.log(report.text);
                        setProgress(report.progress);
                    };

                    const newEngine = await CreateMLCEngine(
                        MODEL_ID,
                        { initProgressCallback: initProgressCallback }
                    );
                    
                    setEngine(newEngine);
                    setIsReady(true);
                } catch (err) {
                    console.error(err);
                    setError(err.message || "Failed to load the model.");
                } finally {
                    setIsLoading(false);
                }
            };

            const initLiteMode = () => {
                setMode('lite');
                setEngine(new MockEngine());
                setIsReady(true);
            };

            // --- CHAT LOGIC ---
            const activeChar = CHARACTERS.find(c => c.id === activeCharId);
            const currentHistory = conversations[activeCharId];

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [conversations, activeCharId, isGenerating]);

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!userInput.trim() || isGenerating || !engine) return;

                const text = userInput;
                setUserInput("");

                const userMsg = { role: 'user', content: text };
                setConversations(prev => ({
                    ...prev,
                    [activeCharId]: [...prev[activeCharId], userMsg]
                }));

                setIsGenerating(true);

                try {
                    const messages = [
                        { role: 'system', content: activeChar.systemPrompt },
                        ...conversations[activeCharId],
                        userMsg
                    ];

                    const completion = await engine.chat.completions.create({
                        messages,
                        temperature: 0.7,
                        max_tokens: 150,
                    });

                    const replyContent = completion.choices[0].message.content;

                    setConversations(prev => ({
                        ...prev,
                        [activeCharId]: [...prev[activeCharId], userMsg, { role: 'assistant', content: replyContent }]
                    }));

                } catch (err) {
                    console.error("Generation error:", err);
                    setConversations(prev => ({
                        ...prev,
                        [activeCharId]: [...prev[activeCharId], { role: 'assistant', content: "Error: Could not generate response." }]
                    }));
                } finally {
                    setIsGenerating(false);
                }
            };

            if (!isReady) {
                return <LoadingScreen 
                    progress={progress} 
                    error={error} 
                    onStart={initEngine} 
                    onStartLite={initLiteMode}
                />;
            }

            return (
                <div className="flex h-screen bg-zinc-950 overflow-hidden">
                    
                    {/* SIDEBAR */}
                    <div className="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col hidden md:flex">
                        <div className="p-6 border-b border-zinc-800">
                            <h2 className="text-xl font-typewriter text-amber-500 font-bold tracking-wider">SUSPECTS</h2>
                            <p className="text-xs text-zinc-500 mt-1">Case #2025-SD</p>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {CHARACTERS.map(char => (
                                <button
                                    key={char.id}
                                    onClick={() => setActiveCharId(char.id)}
                                    className={`w-full text-left p-3 rounded-lg border transition-all duration-200 flex items-center gap-3 ${
                                        activeCharId === char.id
                                            ? 'bg-amber-900/30 border-amber-600/50 ring-1 ring-amber-600/30'
                                            : 'bg-zinc-800/50 border-zinc-800 hover:bg-zinc-800 hover:border-zinc-700'
                                    }`}
                                >
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white shadow-inner ${char.avatar}`}>
                                        {char.name[0]}
                                    </div>
                                    <div>
                                        <div className={`font-bold text-sm ${activeCharId === char.id ? 'text-amber-500' : 'text-zinc-300'}`}>
                                            {char.name}
                                        </div>
                                        <div className="text-xs text-zinc-500">{char.role}</div>
                                    </div>
                                </button>
                            ))}

                            <div className="mt-8 p-4 bg-zinc-950/50 rounded border border-zinc-800 text-xs text-zinc-400 font-mono">
                                <div className="flex items-center gap-2 mb-2 text-amber-600 font-bold">
                                    <BookOpen size={14} /> NOTES
                                </div>
                                <ul className="list-disc pl-4 space-y-1">
                                    <li>Victim: Arthur Pennyworth</li>
                                    <li>Time: 11:00 PM</li>
                                    <li>Weapon: Heavy object</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CHAT */}
                    <div className="flex-1 flex flex-col relative bg-gradient-to-br from-zinc-900 to-zinc-950">
                        
                        {/* Header */}
                        <div className="h-16 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur flex items-center justify-between px-6 z-10">
                            <div className="flex items-center gap-3">
                                <span className="font-typewriter text-xl text-zinc-200 hidden md:block">Interrogation Room A</span>
                                <span className="font-typewriter text-xl text-zinc-200 md:hidden">Room A</span>
                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-900/40 text-amber-500 border border-amber-900/50">REC</span>
                            </div>
                            <div className="text-zinc-500 text-xs font-mono flex items-center gap-2">
                                <span className={`w-2 h-2 rounded-full ${mode === 'full' ? 'bg-green-500' : 'bg-blue-500'} animate-pulse`}></span>
                                {mode === 'full' ? 'NEURAL ENGINE ACTIVE' : 'LITE MODE ACTIVE'}
                            </div>
                        </div>
                        
                         {/* Mobile Character Select */}
                         <div className="md:hidden flex overflow-x-auto p-2 gap-2 border-b border-zinc-800 bg-zinc-900">
                             {CHARACTERS.map(char => (
                                <button
                                    key={char.id}
                                    onClick={() => setActiveCharId(char.id)}
                                    className={`flex-shrink-0 px-3 py-1 rounded-full text-xs font-bold ${
                                        activeCharId === char.id ? 'bg-amber-900 text-amber-100' : 'bg-zinc-800 text-zinc-400'
                                    }`}
                                >
                                    {char.name}
                                </button>
                             ))}
                         </div>

                        {/* Chat History */}
                        <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                            {currentHistory.length === 0 && (
                                <div className="text-center mt-20 opacity-50 animate-fade-in">
                                    <div className={`w-20 h-20 mx-auto rounded-full ${activeChar.avatar} flex items-center justify-center text-3xl font-bold text-white mb-4 shadow-2xl`}>
                                        {activeChar.name[0]}
                                    </div>
                                    <h2 className="text-2xl font-typewriter text-zinc-300 mb-2">{activeChar.name}</h2>
                                    <p className="text-sm text-zinc-500 max-w-md mx-auto">{activeChar.desc}</p>
                                </div>
                            )}
                            
                            {currentHistory.map((msg, idx) => (
                                <ChatMessage key={idx} message={msg} charName={activeChar.name} />
                            ))}
                            
                            {isGenerating && (
                                <div className="flex w-full mb-4 justify-start animate-fade-in">
                                    <div className="px-4 py-3 bg-zinc-800 rounded-2xl rounded-tl-sm flex gap-1 items-center h-10 border border-zinc-700">
                                        <div className="w-2 h-2 bg-zinc-500 rounded-full typing-dot"></div>
                                        <div className="w-2 h-2 bg-zinc-500 rounded-full typing-dot"></div>
                                        <div className="w-2 h-2 bg-zinc-500 rounded-full typing-dot"></div>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="p-4 bg-zinc-900 border-t border-zinc-800">
                            <form onSubmit={handleSendMessage} className="relative max-w-4xl mx-auto flex gap-2">
                                <input
                                    type="text"
                                    value={userInput}
                                    onChange={(e) => setUserInput(e.target.value)}
                                    placeholder={`Ask ${activeChar.name}...`}
                                    className="flex-1 bg-zinc-800 text-zinc-100 placeholder-zinc-500 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 transition-all font-sans"
                                    disabled={isGenerating}
                                />
                                <button 
                                    type="submit" 
                                    disabled={isGenerating || !userInput.trim()}
                                    className="bg-amber-600 hover:bg-amber-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-lg px-4 transition-colors"
                                >
                                    <Send size={20} />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
