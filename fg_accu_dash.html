<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor of Whispers: Procedural Engine</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #a1a1aa; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; width: 4px; height: 4px; background: #71717a; border-radius: 50%; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const OLLAMA_URL = "http://localhost:11434/api/chat";
        const MODEL = "llama3.1:latest";

        const Icons = {
            ShieldAlert: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Cpu: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1V4"/><path d="M15 1V4"/><path d="M9 20V23"/><path d="M15 20V23"/><path d="M20 9H23"/><path d="M20 14H23"/><path d="M1 9H4"/><path d="M1 14H4"/></svg>,
            Zap: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Loader2: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            BookOpen: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Send: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Gavel: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m14 13-5 5"/><path d="m3 21 2-2"/><path d="m9 15 10-10a2 2 0 1 1 3 3L12 18l-3-3Z"/><path d="m15 4 5 5"/><path d="m2 11 7 7"/></svg>,
            ChevronLeft: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="15 18 9 12 15 6"/></svg>,
            FileText: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            Clock: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        };

        const { BookOpen, Send, Loader2, ShieldAlert, Cpu, Zap, Gavel, ChevronLeft, FileText, Clock } = Icons;

        const formatVal = (val) => (typeof val === 'string' ? val : (val?.name || val?.title || "Unknown"));

        function LoadingScreen({ status, onStart, onStartLite }) {
            return (
                <div className="fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center p-6 z-50 text-center font-sans">
                    <div className="max-w-md w-full space-y-8 animate-fade-in">
                        <div>
                            <h1 className="text-4xl font-typewriter text-amber-500 mb-2 tracking-widest uppercase">Manor of Whispers</h1>
                            <p className="text-zinc-500 text-xs tracking-[0.3em] uppercase font-bold">Procedural Investigation Engine</p>
                        </div>

                        {status === 'initializing' ? (
                            <div className="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-2xl space-y-4">
                                <ShieldAlert className="w-12 h-12 text-amber-600 mx-auto" />
                                <div className="space-y-2 mb-6 text-zinc-300">
                                    <h3 className="text-lg font-bold">Welcome, Detective.</h3>
                                    <p className="text-zinc-500 text-sm">Initialize the neural context or run script mode.</p>
                                </div>
                                <button onClick={onStart} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                    <Cpu size={18} /> Load Neural Engine
                                </button>
                                <button onClick={onStartLite} className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                    <Zap size={18} /> Lite Script Mode
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <Loader2 className="animate-spin text-amber-600 mx-auto" size={40} />
                                <p className="font-typewriter text-amber-500 text-sm uppercase tracking-widest animate-pulse">Constructing Crime Scene...</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AdminView({ crimeScene }) {
            const exitAdmin = () => {
                window.location.hash = '';
            };

            return (
                <div className="h-screen bg-zinc-950 flex flex-col animate-fade-in selection:bg-red-900/40 font-sans">
                    <header className="h-16 border-b border-zinc-900 flex items-center justify-between px-8 bg-zinc-900/30 backdrop-blur">
                        <div className="flex items-center gap-4">
                            <button 
                                onClick={exitAdmin}
                                className="flex items-center gap-2 text-zinc-500 hover:text-zinc-100 transition-colors text-xs font-bold uppercase tracking-widest"
                            >
                                <ChevronLeft size={16} /> Return to Investigation
                            </button>
                            <div className="h-4 w-px bg-zinc-800 mx-2" />
                            <h2 className="text-xs font-mono text-amber-600 tracking-[0.3em] uppercase font-bold">
                                Restricted Case File: {formatVal(crimeScene.location)}
                            </h2>
                        </div>
                        <div className="text-[10px] font-mono text-zinc-700 uppercase tracking-widest">
                            System Access: Restricted
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-12 custom-scrollbar">
                        <div className="max-w-5xl mx-auto space-y-16">
                            {/* Full Narrative Paragraph */}
                            <section className="space-y-6">
                                <div className="flex items-center gap-3 text-zinc-600">
                                    <FileText size={18} />
                                    <p className="text-[10px] font-mono uppercase tracking-[0.4em] font-bold">The Narrative Truth</p>
                                </div>
                                <div className="p-10 rounded-[2rem] bg-zinc-900/10 border border-zinc-900 relative group overflow-hidden shadow-2xl">
                                    <div className="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-20 transition-opacity">
                                        <FileText size={160} />
                                    </div>
                                    <p className="text-2xl text-zinc-200 leading-[1.6] font-light first-letter:text-7xl first-letter:font-bold first-letter:text-amber-600 first-letter:mr-4 first-letter:float-left first-letter:mt-2">
                                        {crimeScene.fullStory || "A complex web of deceit has culminated in tragedy. Refer to the details below for a full reconstruction."}
                                    </p>
                                </div>
                            </section>

                            <section className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                <div className="space-y-12">
                                    <div className="space-y-2">
                                        <p className="text-[10px] font-mono text-zinc-600 uppercase tracking-widest font-bold">Targeted Individual</p>
                                        <p className="text-4xl text-zinc-100 font-bold uppercase tracking-tighter">{formatVal(crimeScene.victim)}</p>
                                        <p className="text-sm text-zinc-500 leading-relaxed max-w-md">{crimeScene.victimProfile || "A figure of influence whose hidden choices led to this fatal outcome."}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-8">
                                        <div className="space-y-1">
                                            <p className="text-[10px] font-mono text-zinc-600 uppercase tracking-widest font-bold">Core Motive</p>
                                            <p className="text-zinc-400 text-sm italic leading-snug">"{crimeScene.motive || "N/A"}"</p>
                                        </div>
                                        <div className="space-y-1">
                                            <p className="text-[10px] font-mono text-zinc-600 uppercase tracking-widest font-bold">Instrument</p>
                                            <p className="text-zinc-100 text-lg font-bold">{formatVal(crimeScene.weapon)}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-8">
                                    <div className="p-8 rounded-[2rem] bg-amber-900/5 border border-amber-900/20 space-y-6">
                                        <div className="flex items-center gap-3 text-amber-700">
                                            <ShieldAlert size={18} />
                                            <p className="text-[10px] font-bold uppercase tracking-widest">Incident Discovery</p>
                                        </div>
                                        <p className="text-sm text-zinc-400 leading-relaxed italic">
                                            {crimeScene.discovery || "The discovery of the scene marked the beginning of a investigation that would peel back the layers of high society."}
                                        </p>
                                        
                                        <div className="space-y-3">
                                            <p className="text-[9px] text-zinc-600 uppercase font-bold tracking-widest">Physical Evidence recovered</p>
                                            <div className="flex flex-wrap gap-2">
                                                {Array.isArray(crimeScene.evidenceList) ? crimeScene.evidenceList.map((item, i) => (
                                                    <span key={i} className="px-3 py-1 rounded-full bg-zinc-900 text-zinc-500 text-[10px] border border-zinc-800">
                                                        {item}
                                                    </span>
                                                )) : <span className="text-[10px] text-zinc-700 italic">No items listed.</span>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <section className="space-y-8">
                                <div className="flex items-center gap-4">
                                    <div className="h-px flex-1 bg-zinc-900" />
                                    <p className="text-[10px] font-mono text-zinc-600 uppercase tracking-[0.5em] font-bold">Suspect Data</p>
                                    <div className="h-px flex-1 bg-zinc-900" />
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {crimeScene.suspects.map(s => (
                                        <div 
                                            key={s.id} 
                                            className={`p-8 rounded-3xl border transition-all duration-500 group ${
                                                s.isKiller 
                                                ? 'bg-red-950/5 border-red-900/30' 
                                                : 'bg-zinc-900/10 border-zinc-900'
                                            }`}
                                        >
                                            <div className="mb-6 space-y-1">
                                                <div className="flex items-center justify-between">
                                                    <h3 className="text-lg font-bold text-zinc-100">{s.name}</h3>
                                                    {s.isKiller && (
                                                        <span className="bg-red-900/20 text-red-500 text-[8px] px-2 py-0.5 rounded-full font-bold border border-red-900/50 uppercase">Killer</span>
                                                    )}
                                                </div>
                                                <p className="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">{s.role}</p>
                                            </div>
                                            
                                            <div className="space-y-6">
                                                <div className="space-y-2">
                                                    <p className="text-[9px] text-zinc-600 font-bold uppercase tracking-widest">Confession Trigger</p>
                                                    <p className="font-mono text-xs text-amber-500 bg-zinc-950 p-3 rounded-xl border border-zinc-900">
                                                        {s.clueTrigger}
                                                    </p>
                                                </div>
                                                <div className="space-y-2">
                                                    <p className="text-[9px] text-zinc-600 font-bold uppercase tracking-widest">Secret</p>
                                                    <p className="text-xs text-zinc-400 leading-relaxed italic">
                                                        "{s.secret}"
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </main>
                </div>
            );
        }

        function App() {
            const [status, setStatus] = useState('initializing');
            const [view, setView] = useState('game');
            const [mode, setMode] = useState(null);
            const [crimeScene, setCrimeScene] = useState(null);
            const [activeSuspectId, setActiveSuspectId] = useState(null);
            const [history, setHistory] = useState({});
            const [input, setInput] = useState("");
            const [isThinking, setIsThinking] = useState(false);
            const [evidence, setEvidence] = useState([]);
            const [hasConfessed, setHasConfessed] = useState({});
            const [gameState, setGameState] = useState('playing'); 
            const chatEndRef = useRef(null);

            useEffect(() => {
                const handleHash = () => {
                    if (window.location.hash === '#admiiin') {
                        setView('admin');
                    } else {
                        setView('game');
                    }
                };
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const generateWorld = async (isLite = false) => {
                setStatus('generating');
                setMode(isLite ? 'lite' : 'full');
                
                if (isLite) {
                    setTimeout(() => {
                        setupGame({
                            victim: "Arthur Pennyworth",
                            victimProfile: "A reclusive millionaire with a penchant for expensive wines and even more expensive secrets.",
                            location: "Willow Creek Manor",
                            weapon: "Poisoned Sherry",
                            motive: "Greed and the desperate preservation of a social reputation.",
                            discovery: "The body was found in the locked study at midnight. Arthur was slumped over his desk, a glass of half-finished sherry still clutched in his hand.",
                            fullStory: "Arthur Pennyworth had spent his final days rewriting his inheritance to exclude his wife, Lady Vivian, after discovering her infidelity. On the night of the gala, the killer slipped into the study under the cover of the fireworks display. They knew Arthur had a habit of late-night drinking and laced his personal decanter with a fast-acting toxin. The motive was simple: greed and the preservation of a social reputation that Arthur was about to destroy.",
                            evidenceList: ["Laced Sherry Decanter", "Muddy footprints", "Torn letter"],
                            timeline: ["21:00 Fireworks begin", "22:15 Poison is introduced", "00:00 Discovery"],
                            suspects: [
                                { id: 's1', name: "Lady Vivian", role: "The Widow", secret: "Was having an affair with a business rival.", isKiller: true, clueTrigger: "will" },
                                { id: 's2', name: "James", role: "The Butler", secret: "Has been embezzling small amounts.", isKiller: false, clueTrigger: "dress" },
                                { id: 's3', name: "Robert Sterling", role: "Business Partner", secret: "Owes millions in gambling debts.", isKiller: false, clueTrigger: "ledger" }
                            ]
                        });
                    }, 1200);
                    return;
                }

                try {
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL,
                            format: "json",
                            stream: false,
                            messages: [{ role: "user", content: "Generate a murder mystery JSON. victim (string), victimProfile (string), location (string), weapon (string), motive (string), discovery (string), fullStory (string - 1 long paragraph), evidenceList (array of strings), timeline (array of strings). Array suspects (between 3 and 7 unique entities): id, name, role, secret, isKiller (exactly one true), clueTrigger (string). JSON ONLY." }]
                        })
                    });
                    const data = await response.json();
                    setupGame(JSON.parse(data.message.content));
                } catch (err) {
                    setStatus('initializing');
                    alert("Ollama connection failed. Run with OLLAMA_ORIGINS=\"*\"");
                }
            };

            const setupGame = (scene) => {
                setCrimeScene(scene);
                setActiveSuspectId(scene.suspects[0].id);
                const initialHistory = {};
                scene.suspects.forEach(s => initialHistory[s.id] = []);
                setHistory(initialHistory);
                setStatus('playing');
            };

            const handleResponse = (reply, suspect, triggerDetected) => {
                setHistory(prev => ({
                    ...prev,
                    [activeSuspectId]: [...prev[activeSuspectId], { role: 'assistant', content: reply }]
                }));

                // Logic fix: Any suspect that hits their trigger is now "Accusable"
                const isTriggered = triggerDetected || reply.toLowerCase().includes(suspect.clueTrigger.toLowerCase());
                if (isTriggered) {
                    setEvidence(prev => {
                        const note = `${suspect.name} reacted to: "${suspect.clueTrigger}"`;
                        return prev.includes(note) ? prev : [...prev, note];
                    });
                    
                    // UNLOCK THE ACCUSE BUTTON for this suspect
                    setHasConfessed(prev => ({ ...prev, [suspect.id]: true }));
                }
                setIsThinking(false);
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isThinking || gameState !== 'playing') return;

                const currentSuspect = crimeScene.suspects.find(s => s.id === activeSuspectId);
                const userMsgText = input.trim();
                const userMsg = { role: 'user', content: userMsgText };
                
                // Pre-check for trigger in user input
                const triggerDetected = userMsgText.toLowerCase().includes(currentSuspect.clueTrigger.toLowerCase());
                
                setInput("");
                setHistory(prev => ({ ...prev, [activeSuspectId]: [...prev[activeSuspectId], userMsg] }));
                setIsThinking(true);

                if (mode === 'lite') {
                    setTimeout(() => {
                        const reply = triggerDetected 
                            ? (currentSuspect.isKiller ? `Fine! I killed them! I killed ${formatVal(crimeScene.victim)} because I was out of options!` : `Yes, I am hiding something! I admit it! My secret is: ${currentSuspect.secret}`)
                            : `I have nothing to hide, Detective. Why are you bothering me?`;
                        handleResponse(reply, currentSuspect, triggerDetected);
                    }, 800);
                    return;
                }

                try {
                    const systemPrompt = `You are ${currentSuspect.name}, the ${currentSuspect.role}. ${formatVal(crimeScene.victim)} died by ${formatVal(crimeScene.weapon)}. Secret: ${currentSuspect.secret}. CRITICAL: If the detective mentions '${currentSuspect.clueTrigger}', you MUST admit to your secret immediately. If you are the killer (${currentSuspect.isKiller}), you MUST confess to the murder using the words "I killed them" when they mention the trigger. Max 2 sentences.`;
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL,
                            stream: false,
                            messages: [{ role: 'system', content: systemPrompt }, ...history[activeSuspectId], userMsg]
                        })
                    });
                    const data = await response.json();
                    handleResponse(data.message.content, currentSuspect, triggerDetected);
                } catch (err) {
                    setIsThinking(false);
                }
            };

            const handleAccuse = (suspect) => {
                if (!hasConfessed[suspect.id]) return;
                setGameState(suspect.isKiller ? 'won' : 'lost');
            };

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history, activeSuspectId, isThinking, view]);

            if (status !== 'playing') return <LoadingScreen status={status} onStart={() => generateWorld(false)} onStartLite={() => generateWorld(true)} />;

            if (view === 'admin') return <AdminView crimeScene={crimeScene} />;

            const currentSuspect = crimeScene.suspects.find(s => s.id === activeSuspectId);

            return (
                <div className="flex h-screen bg-zinc-950 overflow-hidden relative selection:bg-amber-500/30">
                    
                    {/* VERDICT OVERLAY */}
                    {gameState !== 'playing' && (
                        <div className="absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-8 animate-fade-in text-center">
                            <div className="max-w-2xl">
                                <h2 className={`text-7xl font-typewriter mb-6 ${gameState === 'won' ? 'text-amber-500' : 'text-red-600'}`}>
                                    {gameState === 'won' ? 'CASE CLOSED' : 'FAILURE'}
                                </h2>
                                <p className="text-zinc-400 text-lg leading-relaxed mb-10 font-medium font-sans">
                                    {gameState === 'won' 
                                        ? `Congratulations, Detective. You successfully navigated the web of lies at ${formatVal(crimeScene.location)} and secured a confession.`
                                        : `Your accusation targeted the wrong suspect. The true killer escaped while justice failed.`}
                                </p>
                                <button onClick={() => window.location.reload()} className="bg-zinc-100 text-zinc-950 px-10 py-4 rounded-2xl font-bold hover:bg-white transition-all scale-110 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.2)] font-sans uppercase tracking-widest text-xs">
                                    NEW INVESTIGATION
                                </button>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR */}
                    <div className="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col hidden md:flex">
                        <div className="p-6 border-b border-zinc-800 bg-zinc-900/50 backdrop-blur">
                            <h2 className="text-lg font-typewriter text-amber-500 font-bold tracking-tight uppercase truncate">{formatVal(crimeScene.location)}</h2>
                            <p className="text-[10px] text-zinc-500 mt-1 uppercase tracking-widest font-bold font-sans">Victim: {formatVal(crimeScene.victim)}</p>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 scrollbar-hide">
                            <h3 className="text-[10px] font-bold text-zinc-600 px-2 uppercase tracking-[0.2em] mb-4 font-sans">Suspect Pool</h3>
                            {crimeScene.suspects.map(s => (
                                <div key={s.id} className="relative group font-sans">
                                    <button
                                        onClick={() => setActiveSuspectId(s.id)}
                                        className={`w-full text-left p-4 rounded-2xl border transition-all duration-300 flex items-center gap-4 ${
                                            activeSuspectId === s.id 
                                            ? 'bg-amber-900/10 border-amber-600/50 ring-1 ring-amber-600/20 shadow-xl' 
                                            : 'bg-zinc-800/30 border-transparent hover:bg-zinc-800'
                                        }`}
                                    >
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-lg ${activeSuspectId === s.id ? 'bg-amber-600' : 'bg-zinc-700'}`}>
                                            {s.name[0]}
                                        </div>
                                        <div className="flex-1">
                                            <div className={`font-bold text-sm ${activeSuspectId === s.id ? 'text-amber-500' : 'text-zinc-300'}`}>{s.name}</div>
                                            <div className="text-[10px] text-zinc-500 uppercase font-semibold">{s.role}</div>
                                        </div>
                                    </button>
                                    
                                    <button 
                                        onClick={() => handleAccuse(s)}
                                        disabled={!hasConfessed[s.id]}
                                        className={`absolute right-3 top-1/2 -translate-y-1/2 p-2.5 rounded-xl transition-all shadow-xl ${
                                            hasConfessed[s.id] 
                                            ? 'bg-red-600 text-white hover:bg-red-500 hover:scale-110 active:scale-90 opacity-100 animate-pulse' 
                                            : 'bg-zinc-800 text-zinc-600 opacity-0 group-hover:opacity-40 cursor-not-allowed'
                                        }`}
                                        title={hasConfessed[s.id] ? "Final Accusation" : "Waiting for confession..."}
                                    >
                                        <Gavel size={14} />
                                    </button>
                                </div>
                            ))}

                            <div className="mt-8 p-5 bg-zinc-950/50 rounded-2xl border border-zinc-800 shadow-inner font-sans">
                                <div className="flex items-center gap-2 mb-4 text-amber-600 font-bold text-[10px] tracking-widest">
                                    <BookOpen size={14} /> EVIDENCE LOG
                                </div>
                                <div className="space-y-2">
                                    <div className="p-3 bg-zinc-900/80 rounded-xl border border-zinc-800 italic text-[10px] opacity-70 leading-relaxed">
                                        Found: {formatVal(crimeScene.weapon)}
                                    </div>
                                    {evidence.map((e, i) => (
                                        <div key={i} className="p-3 bg-amber-900/10 rounded-xl border border-amber-900/20 text-amber-200 animate-fade-in text-[10px] flex gap-2">
                                            <span>✓</span> {e}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col relative bg-zinc-950">
                        <div className="h-16 border-b border-zinc-900 flex items-center justify-between px-8 bg-zinc-950/50 backdrop-blur z-10">
                            <div className="flex items-center gap-4">
                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(220,38,38,0.8)]" />
                                <span className="font-typewriter text-zinc-400 text-sm uppercase tracking-wide truncate max-w-[300px]">
                                    {currentSuspect.name}
                                </span>
                            </div>
                            <div className="text-[10px] font-mono text-zinc-700 uppercase tracking-[0.2em] hidden sm:block">
                                {mode} investigation_active
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-8 space-y-8 scrollbar-hide">
                            {history[activeSuspectId].length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center opacity-10 select-none pointer-events-none">
                                    <h2 className="text-5xl font-typewriter text-zinc-600 mb-2 uppercase text-center">{currentSuspect.name}</h2>
                                    <p className="text-xs uppercase tracking-[0.5em] font-bold font-sans">{currentSuspect.role}</p>
                                </div>
                            )}

                            {history[activeSuspectId].map((m, i) => (
                                <div key={i} className={`flex w-full ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                    <div className="max-w-xl font-sans">
                                        <div className={`text-[9px] mb-1 uppercase tracking-[0.2em] font-bold ${m.role === 'user' ? 'text-right text-zinc-600' : 'text-zinc-500'}`}>
                                            {m.role === 'user' ? 'Detective' : currentSuspect.name}
                                        </div>
                                        <div className={`p-5 rounded-2xl text-sm leading-relaxed shadow-lg ${
                                            m.role === 'user' 
                                            ? 'bg-amber-700 text-white rounded-tr-none shadow-amber-900/20' 
                                            : 'bg-zinc-900 text-zinc-300 border border-zinc-800 rounded-tl-none italic'
                                        }`}>
                                            {m.content}
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {isThinking && (
                                <div className="flex gap-2 p-4 bg-zinc-900 rounded-2xl w-fit border border-zinc-800 shadow-xl">
                                    <div className="typing-dot" style={{animationDelay: '0s'}} />
                                    <div className="typing-dot" style={{animationDelay: '0.2s'}} />
                                    <div className="typing-dot" style={{animationDelay: '0.4s'}} />
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        <div className="p-8 bg-gradient-to-t from-zinc-950 via-zinc-950 to-transparent">
                            <form onSubmit={sendMessage} className="max-w-4xl mx-auto flex gap-4 font-sans">
                                <input 
                                    className="flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-amber-900 focus:ring-1 focus:ring-amber-900/50 transition-all disabled:opacity-30" 
                                    placeholder={gameState !== 'playing' ? "Terminal Closed" : `Force ${currentSuspect.name} to break...`} 
                                    value={input} 
                                    onChange={e => setInput(e.target.value)}
                                    disabled={isThinking || gameState !== 'playing'}
                                />
                                <button 
                                    className="bg-zinc-100 text-zinc-950 px-8 rounded-2xl font-bold hover:bg-white transition-all shadow-xl hover:scale-105 active:scale-95 disabled:opacity-20"
                                    disabled={isThinking || !input.trim() || gameState !== 'playing'}
                                >
                                    <Send size={20} />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
