<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor of Whispers: Roleplay Engine v0.9.02</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #a1a1aa; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; width: 4px; height: 4px; background: #71717a; border-radius: 50%; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        .glow-red { box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); }
        .text-glow-amber { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        const OLLAMA_URL = "http://localhost:11434/api/chat";
        const MODEL = "gemma4:";

        const Icons = {
            ShieldAlert: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Cpu: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1V4m6-3v3M9 20v3m6-3v3M20 9h3m-3 5h3M1 9h3m-3 5h3"/></svg>,
            Zap: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Loader2: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${p.className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            BookOpen: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Send: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Gavel: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m14 13-5 5m-6 3 2-2m4-4 10-10a2 2 0 1 1 3 3L12 18l-3-3Zm6-11 5 5m-18 2 7 7"/></svg>,
            ChevronLeft: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
            FileText: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            Activity: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Check: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
        };

        const { BookOpen, Send, Loader2, ShieldAlert, Cpu, Zap, Gavel, ChevronLeft, FileText, Activity, Check } = Icons;

        const formatVal = (val) => {
            if (!val) return "";
            if (typeof val === 'string') return val;
            if (typeof val === 'object') return val.name || val.title || val.item || val.description || val.text || JSON.stringify(val);
            return String(val);
        };

        const cleanJSON = (str) => {
            try {
                const match = str.match(/\{[\s\S]*\}/);
                return match ? match[0] : str;
            } catch (e) { return str; }
        };

        function LoadingScreen({ status, onStart, onStartLite }) {
            return (
                <div className="fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center p-6 z-50 text-center font-sans">
                    <div className="max-w-md w-full space-y-8 animate-fade-in">
                        <div>
                            <h1 className="text-4xl font-typewriter text-amber-500 mb-2 tracking-widest uppercase">Manor of Whispers</h1>
                            <p className="text-zinc-500 text-xs tracking-[0.3em] uppercase font-bold">Signal-Based Roleplay Engine v1.0</p>
                        </div>
                        {status === 'initializing' ? (
                            <div className="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-2xl space-y-4">
                                <ShieldAlert className="w-12 h-12 text-amber-600 mx-auto" />
                                <div className="space-y-2 mb-6 text-zinc-300">
                                    <h3 className="text-lg font-bold">Systems Online, Detective Srijan.</h3>
                                    <p className="text-zinc-500 text-sm">Select the core processor for this case.</p>
                                </div>
                                <button onClick={() => onStart()} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 font-sans uppercase text-xs tracking-widest">
                                    <Cpu size={18} /> Neural Core (Ollama)
                                </button>
                                <button onClick={() => onStartLite()} className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 font-sans uppercase text-xs tracking-widest">
                                    <Zap size={18} /> Mock Script Core
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <Loader2 className="text-amber-600 mx-auto" size={40} />
                                <p className="font-typewriter text-amber-500 text-sm uppercase tracking-widest animate-pulse">Constructing Narrative Logic...</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AdminView({ crimeScene }) {
            return (
                <div className="h-screen bg-zinc-950 flex flex-col animate-fade-in font-sans">
                    <header className="h-16 border-b border-zinc-900 flex items-center justify-between px-8 bg-zinc-900/30 backdrop-blur">
                        <div className="flex items-center gap-4">
                            <button onClick={() => window.location.hash = ''} className="flex items-center gap-2 text-zinc-500 hover:text-zinc-100 transition-colors text-xs font-bold uppercase tracking-widest">
                                <ChevronLeft size={16} /> Exit Archive
                            </button>
                            <h2 className="text-xs font-mono text-amber-600 tracking-[0.3em] uppercase font-bold">Hidden Case Files</h2>
                        </div>
                    </header>
                    <main className="flex-1 overflow-y-auto p-12 custom-scrollbar">
                         <pre className="text-xs text-zinc-500 bg-zinc-900 p-8 rounded-2xl border border-zinc-800">{JSON.stringify(crimeScene, null, 2)}</pre>
                    </main>
                </div>
            );
        }

        function App() {
            const [status, setStatus] = useState('initializing');
            const [activeTab, setActiveTab] = useState('overview'); 
            const [mode, setMode] = useState(null);
            const [crimeScene, setCrimeScene] = useState(null);
            const [activeSuspectId, setActiveSuspectId] = useState(null);
            const [history, setHistory] = useState({});
            const [input, setInput] = useState("");
            const [isThinking, setIsThinking] = useState(false);
            const [evidence, setEvidence] = useState([]);
            const [completedActions, setCompletedActions] = useState(new Set());
            const [hasConfessed, setHasConfessed] = useState({});
            const [gameState, setGameState] = useState('playing'); 
            const chatEndRef = useRef(null);
            const [view, setView] = useState('game'); 

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [history, isThinking]);

            useEffect(() => {
                const handleHash = () => setView(window.location.hash === '#archive' ? 'admin' : 'game');
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const generateWorld = async (isLite = false) => {
                setStatus('generating');
                setMode(isLite ? 'lite' : 'full');
                
                if (isLite) {
                    setTimeout(() => setupGame({
                        victim: "Arthur Pennyworth",
                        location: "Willow Creek Manor",
                        weapon: "Poisoned Sherry",
                        motive: "Betrayal and inheritance greed.",
                        fullStory: "Arthur Pennyworth was discovered dead in his study. He discovered his wife's affair and planned to disinherit her. Lady Vivian killed him to protect her future.",
                        evidenceList: ["Laced Sherry", "Torn Will"],
                        investigativeActions: [
                            { id: 'a1', task: "Examine the desk", result: "Found a revised will." },
                            { id: 'a2', task: "Inspect the glass", result: "Traces of toxin detected." }
                        ],
                        suspects: [
                            { id: 's1', name: "Lady Vivian", role: "The Widow", secret: "Had an affair.", isKiller: true, clueTrigger: "will" },
                            { id: 's2', name: "James", role: "The Butler", secret: "Saw the poison.", isKiller: false, clueTrigger: "glass" },
                        ]
                    }), 1000);
                    return;
                }

                try {
                    const prompt = `Generate a murder mystery JSON. 
                    Include: victim, victimProfile, discovery, location, weapon, motive, fullStory, timeline, evidenceList,
                    investigativeActions (array of 4: id, task, result),
                    suspects (array of 5: id, name, role, secret, isKiller, clueTrigger). 
                    JSON ONLY.`;
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL, format: "json", stream: false,
                            messages: [{ role: "user", content: prompt }]
                        })
                    });
                    const data = await response.json();
                    setupGame(JSON.parse(cleanJSON(data.message.content)));
                } catch (err) { setStatus('initializing'); alert("Neural core connection failed."); }
            };

            const setupGame = (scene) => {
                setCrimeScene(scene);
                setActiveSuspectId(scene.suspects[0].id);
                const initialH = {}; scene.suspects.forEach(s => initialH[s.id] = []);
                setHistory(initialH);
                setStatus('playing');
            };

            const handleResponse = (rawResponse, sId) => {
                const s = crimeScene.suspects.find(sus => sus.id === sId);
                try {
                    const signal = JSON.parse(cleanJSON(rawResponse));
                    
                    // Signal based roleplay metadata
                    const messageObj = {
                        role: 'assistant',
                        content: formatVal(signal.dialogue),
                        tone: formatVal(signal.tone),
                        bodyLanguage: formatVal(signal.bodyLanguage),
                        suspicion: signal.suspicionLevel || 0
                    };

                    setHistory(prev => ({ ...prev, [sId]: [...prev[sId], messageObj] }));
                    
                    if (signal.admission === true) {
                        setEvidence(prev => [...new Set([...prev, `CONFESSION: ${formatVal(s.name)} admitted guilt.`])]);
                        setHasConfessed(prev => ({ ...prev, [sId]: true }));
                    }
                } catch (e) {
                    // Fallback if LLM fails JSON
                    setHistory(prev => ({ ...prev, [sId]: [...prev[sId], { role: 'assistant', content: rawResponse }] }));
                }
                setIsThinking(false);
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isThinking || gameState !== 'playing') return;
                
                const sId = activeSuspectId;
                const s = crimeScene.suspects.find(sus => sus.id === sId);
                const query = input.trim();
                
                setHistory(prev => ({ ...prev, [sId]: [...prev[sId], { role: 'user', content: query }] }));
                setInput(""); 
                setIsThinking(true);

                if (mode === 'lite') {
                    const isTrigger = query.toLowerCase().includes(formatVal(s.clueTrigger).toLowerCase());
                    setTimeout(() => handleResponse(JSON.stringify({
                        dialogue: isTrigger ? "I... I can't keep this secret anymore. Yes, I did it." : "I don't know what you're talking about.",
                        tone: isTrigger ? "Defeated" : "Defensive",
                        bodyLanguage: isTrigger ? "Slumping into the chair, head in hands" : "Crossing arms and looking away",
                        admission: isTrigger,
                        suspicionLevel: isTrigger ? 100 : 40
                    }), sId), 800);
                    return;
                }

                try {
                    const systemPrompt = `Roleplay as ${formatVal(s.name)} (${formatVal(s.role)}).
                    Victim: ${formatVal(crimeScene.victim)}. Your Secret: ${formatVal(s.secret)}.
                    CRITICAL: If the detective mentions "${formatVal(s.clueTrigger)}", you MUST confess.
                    RESPOND ONLY IN JSON:
                    { "dialogue": "speech", "tone": "mood", "bodyLanguage": "action", "admission": boolean, "suspicionLevel": 0-100 }`;

                    const response = await fetch(OLLAMA_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL, stream: false, format: "json",
                            messages: [{ role: 'system', content: systemPrompt }, ...history[sId], { role: 'user', content: query }]
                        })
                    });
                    const data = await response.json();
                    handleResponse(data.message.content, sId);
                } catch (err) { setIsThinking(false); }
            };

            const performAction = (action) => {
                if (completedActions.has(action.id)) return;
                setCompletedActions(new Set([...completedActions, action.id]));
                setEvidence(prev => [...new Set([...prev, `FIELD DATA: ${formatVal(action.result)}`])]);
            };

            if (status !== 'playing') return <LoadingScreen status={status} onStart={() => generateWorld(false)} onStartLite={() => generateWorld(true)} />;
            if (view === 'admin') return <AdminView crimeScene={crimeScene} />
            const currentSuspect = crimeScene.suspects.find(s => s.id === activeSuspectId);

            return (
                <div className="flex h-screen bg-zinc-950 overflow-hidden relative selection:bg-amber-500/30">
                    {/* VERDICT OVERLAY */}
                    {gameState !== 'playing' && (
                        <div className="absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-8 animate-fade-in text-center font-sans">
                            <h2 className={`text-7xl font-typewriter mb-6 ${gameState === 'won' ? 'text-amber-500' : 'text-red-600'}`}>{gameState === 'won' ? 'CASE CLOSED' : 'CASE FAILED'}</h2>
                            <p className="text-zinc-400 text-lg mb-10 max-w-xl">{gameState === 'won' ? `Justice served at ${formatVal(crimeScene.location)}. The Truth was secured.` : `Wrongful accusation. The killer vanished into the night.`}</p>
                            <button onClick={() => window.location.reload()} className="bg-zinc-100 text-zinc-950 px-10 py-4 rounded-2xl font-bold uppercase tracking-widest text-xs">Reopen Case</button>
                        </div>
                    )}

                    {/* SIDEBAR */}
                    <div className="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col hidden md:flex">
                        <div className="p-6 border-b border-zinc-800 bg-zinc-900/50">
                            <h2 className="text-lg font-typewriter text-amber-500 font-bold uppercase truncate">{formatVal(crimeScene.location)}</h2>
                            <p className="text-[10px] text-zinc-500 mt-1 uppercase tracking-widest font-bold">Srijan's Investigation</p>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 scrollbar-hide font-sans">
                            <h3 className="text-[10px] font-bold text-zinc-600 px-2 uppercase tracking-widest mb-4">Interview Priority</h3>
                            <div className="space-y-2">
                                {crimeScene.suspects.map(s => (
                                    <div key={s.id} className="relative group">
                                        <button onClick={() => { setActiveSuspectId(s.id); setActiveTab('interrogation'); }} className={`w-full text-left p-4 rounded-2xl border transition-all ${activeSuspectId === s.id && activeTab === 'interrogation' ? 'bg-amber-900/10 border-amber-600/50' : 'bg-zinc-800/30 border-transparent hover:bg-zinc-800'}`}>
                                            <div className="font-bold text-sm text-zinc-200">{formatVal(s.name)}</div>
                                            <div className="text-[10px] text-zinc-500 uppercase">{formatVal(s.role)}</div>
                                        </button>
                                        <button 
                                            onClick={() => setGameState(s.isKiller ? 'won' : 'lost')} 
                                            disabled={!hasConfessed[s.id]} 
                                            className={`absolute right-3 top-1/2 -translate-y-1/2 p-2.5 rounded-xl transition-all ${hasConfessed[s.id] ? 'bg-red-600 text-white animate-pulse glow-red shadow-lg' : 'bg-zinc-800 text-zinc-700 opacity-20'}`}
                                            title={hasConfessed[s.id] ? "Warrant ready" : "Insufficient evidence"}
                                        >
                                            <Gavel size={14} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-8 p-5 bg-zinc-950/50 rounded-2xl border border-zinc-800">
                                <div className="flex items-center gap-2 mb-4 text-amber-600 font-bold text-[10px] tracking-widest uppercase"><BookOpen size={14} /> Evidence Log</div>
                                <div className="space-y-2 text-[10px]">
                                    {evidence.length === 0 && <p className="text-zinc-700 italic">No hard evidence collected.</p>}
                                    {evidence.map((e, i) => <div key={i} className="p-3 bg-amber-900/10 rounded-xl border border-amber-900/20 text-amber-200 animate-fade-in flex gap-2"><span>●</span> {formatVal(e)}</div>)}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MAIN AREA */}
                    <div className="flex-1 flex flex-col bg-zinc-950 font-sans">
                        <div className="h-16 border-b border-zinc-900 flex items-center justify-between px-8 bg-zinc-950/50 backdrop-blur z-10">
                            <div className="flex items-center gap-6">
                                <button onClick={() => setActiveTab('overview')} className={`flex items-center gap-2 text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'overview' ? 'text-zinc-100 border-b-2 border-amber-600 pb-1' : 'text-zinc-600 hover:text-zinc-400'}`}>
                                    <FileText size={14} /> Case File
                                </button>
                                <button onClick={() => setActiveTab('interrogation')} className={`flex items-center gap-2 text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'interrogation' ? 'text-zinc-100 border-b-2 border-amber-600 pb-1' : 'text-zinc-600 hover:text-zinc-400'}`}>
                                    <Send size={14} /> Interrogation
                                </button>
                                <button onClick={() => setActiveTab('actions')} className={`flex items-center gap-2 text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'actions' ? 'text-zinc-100 border-b-2 border-amber-600 pb-1' : 'text-zinc-600 hover:text-zinc-400'}`}>
                                    <Activity size={14} /> Field Actions
                                </button>
                            </div>
                        </div>

                        {activeTab === 'overview' && (
                            <div className="flex-1 overflow-y-auto p-12 custom-scrollbar animate-fade-in">
                                <div className="max-w-4xl mx-auto space-y-12">
                                    <section className="space-y-6">
                                        <p className="text-[10px] font-mono uppercase tracking-[0.4em] font-bold text-amber-600">The Discovery</p>
                                        <div className="p-12 rounded-[2.5rem] bg-zinc-900/20 border border-zinc-800 relative overflow-hidden shadow-2xl">
                                            <div className="absolute top-0 right-0 p-4 opacity-5"><FileText size={160} /></div>
                                            <p className="text-2xl text-zinc-200 leading-[1.6] italic first-letter:text-7xl first-letter:font-bold first-letter:text-amber-600 first-letter:mr-4 first-letter:float-left">
                                                {formatVal(crimeScene.fullStory)}
                                            </p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-8">
                                            <div className="p-6 rounded-2xl bg-zinc-900/40 border border-zinc-800">
                                                <p className="text-[9px] uppercase tracking-widest text-zinc-600 font-bold mb-2">Victim</p>
                                                <p className="text-xl font-bold text-zinc-100">{formatVal(crimeScene.victim)}</p>
                                            </div>
                                            <div className="p-6 rounded-2xl bg-zinc-900/40 border border-zinc-800">
                                                <p className="text-[9px] uppercase tracking-widest text-zinc-600 font-bold mb-2">Primary Weapon</p>
                                                <p className="text-zinc-300 italic">{formatVal(crimeScene.weapon)}</p>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        )}

                        {activeTab === 'interrogation' && (
                            <Fragment>
                                <div className="flex-1 overflow-y-auto p-8 space-y-8 scrollbar-hide">
                                    {history[activeSuspectId]?.map((m, i) => (
                                        <div key={i} className={`flex w-full ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                            <div className="max-w-xl">
                                                <div className={`flex items-center gap-2 text-[9px] mb-1 uppercase tracking-widest font-bold ${m.role === 'user' ? 'justify-end text-zinc-600' : 'text-zinc-500'}`}>
                                                    {m.role === 'user' ? 'Srijan' : formatVal(currentSuspect.name)}
                                                    {m.tone && <span className="bg-zinc-800 px-2 py-0.5 rounded text-amber-500 lowercase italic">[{m.tone}]</span>}
                                                </div>
                                                <div className={`p-5 rounded-2xl text-sm shadow-xl transition-all ${m.role === 'user' ? 'bg-amber-700 text-white rounded-tr-none' : 'bg-zinc-900 text-zinc-300 border border-zinc-800 rounded-tl-none'}`}>
                                                    {m.bodyLanguage && <p className="text-[11px] text-zinc-500 mb-2 italic border-l border-zinc-700 pl-3">*{m.bodyLanguage}*</p>}
                                                    <p className={m.role === 'assistant' ? 'italic' : ''}>{formatVal(m.content)}</p>
                                                </div>
                                                {m.suspicion > 0 && (
                                                    <div className="mt-2 h-1 w-full bg-zinc-900 rounded-full overflow-hidden">
                                                        <div className="h-full bg-amber-600 transition-all duration-1000" style={{width: `${m.suspicion}%`}} />
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {isThinking && <div className="flex gap-2 p-4 bg-zinc-900 rounded-2xl w-fit border border-zinc-800"><div className="typing-dot" /><div className="typing-dot" style={{animationDelay:'0.2s'}} /><div className="typing-dot" style={{animationDelay:'0.4s'}} /></div>}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-8 bg-zinc-950">
                                    <form onSubmit={sendMessage} className="max-w-4xl mx-auto flex gap-4">
                                        <input className="flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-amber-900 transition-all" placeholder={`Ask ${formatVal(currentSuspect.name)} about the ${formatVal(crimeScene.weapon)}...`} value={input} onChange={e => setInput(e.target.value)} disabled={isThinking || gameState !== 'playing'} />
                                        <button className="bg-zinc-100 text-zinc-950 px-8 rounded-2xl font-bold hover:bg-white shadow-xl transition-all"><Send size={20} /></button>
                                    </form>
                                </div>
                            </Fragment>
                        )}

                        {activeTab === 'actions' && (
                            <div className="flex-1 overflow-y-auto p-12 custom-scrollbar animate-fade-in">
                                <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {crimeScene.investigativeActions?.map(a => (
                                        <button key={a.id} onClick={() => performAction(a)} disabled={completedActions.has(a.id)} className={`text-left p-8 rounded-[2rem] border transition-all relative overflow-hidden ${completedActions.has(a.id) ? 'bg-zinc-900/30 border-zinc-900 opacity-60' : 'bg-zinc-900/10 border-zinc-800 hover:border-amber-900/50 shadow-xl'}`}>
                                            <div className="flex justify-between mb-4"><span className="text-[10px] font-mono text-amber-600 uppercase tracking-widest font-bold">Procedure</span>{completedActions.has(a.id) && <Check size={16} className="text-amber-500" />}</div>
                                            <p className="text-sm font-bold text-zinc-200 mb-4">{formatVal(a.task)}</p>
                                            {completedActions.has(a.id) && <div className="p-4 bg-zinc-950 border border-zinc-900 rounded-2xl animate-fade-in text-xs text-zinc-400 italic">"{formatVal(a.result)}"</div>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
