<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor of Whispers: Procedural Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #a1a1aa; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        @keyframes slide-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; width: 4px; height: 4px; background: #71717a; border-radius: 50%; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const OLLAMA_URL = "http://localhost:11434/api/chat";
        const MODEL = "llama3.1:latest";

        function App() {
            const [status, setStatus] = useState('initializing'); // initializing, generating, playing, error
            const [crimeScene, setCrimeScene] = useState(null);
            const [activeSuspectId, setActiveSuspectId] = useState(null);
            const [history, setHistory] = useState({});
            const [input, setInput] = useState("");
            const [isThinking, setIsThinking] = useState(false);
            const [evidence, setEvidence] = useState([]);
            const chatEndRef = useRef(null);

            useEffect(() => {
                const generateWorld = async () => {
                    try {
                        setStatus('generating');
                        const prompt = `Act as a Murder Mystery Writer. Generate a unique crime scene for Srijan's detective game.
                        
                        Create a JSON response with:
                        - "victim": A wealthy person's name.
                        - "location": Name of the manor/estate.
                        - "weapon": The murder weapon.
                        - "motive": A complex reason for the murder.
                        - "suspects": An array of 3 to 6 unique characters. Each must have:
                            - "id": unique string
                            - "name": full name
                            - "role": e.g., Gardener, Cousin, Lawyer
                            - "secret": a deep secret they are hiding
                            - "isKiller": boolean (only one true)
                            - "clueTrigger": a specific keyword that makes them panic or confess.
                        
                        Return ONLY the JSON.`;

                        const response = await fetch(OLLAMA_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: MODEL,
                                messages: [{ role: "user", content: prompt }],
                                stream: false,
                                format: "json"
                            })
                        });

                        const data = await response.json();
                        const scene = JSON.parse(data.message.content);
                        
                        setCrimeScene(scene);
                        setActiveSuspectId(scene.suspects[0].id);
                        
                        // Initialize chat histories
                        const initialHistory = {};
                        scene.suspects.forEach(s => initialHistory[s.id] = []);
                        setHistory(initialHistory);
                        
                        setStatus('playing');
                    } catch (err) {
                        console.error(err);
                        setStatus('error');
                    }
                };
                generateWorld();
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history, activeSuspectId, isThinking]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isThinking) return;

                const currentSuspect = crimeScene.suspects.find(s => s.id === activeSuspectId);
                const userMsg = { role: 'user', content: input };
                setInput("");
                
                setHistory(prev => ({
                    ...prev,
                    [activeSuspectId]: [...prev[activeSuspectId], userMsg]
                }));

                setIsThinking(true);

                const systemPrompt = `You are ${currentSuspect.name}, the ${currentSuspect.role} at ${crimeScene.location}.
                Context: ${crimeScene.victim} was murdered with a ${crimeScene.weapon}.
                Your Secret: ${currentSuspect.secret}.
                Killer Status: ${currentSuspect.isKiller ? "YOU ARE THE KILLER. Deny everything unless the detective mentions " + currentSuspect.clueTrigger : "You are innocent but suspicious."}.
                
                Guidelines:
                1. Stay in character. Speak realistically for your role.
                2. Be concise (2-3 sentences max).
                3. If the user says "${currentSuspect.clueTrigger}", you must get extremely nervous or confess if you are the killer.`;

                try {
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                ...history[activeSuspectId],
                                userMsg
                            ],
                            stream: false
                        })
                    });

                    const data = await response.json();
                    const reply = data.message.content;

                    setHistory(prev => ({
                        ...prev,
                        [activeSuspectId]: [...prev[activeSuspectId], { role: 'assistant', content: reply }]
                    }));

                    // Logic: If reply contains clue trigger, mark evidence
                    if (reply.toLowerCase().includes(currentSuspect.clueTrigger.toLowerCase())) {
                        setEvidence(prev => [...prev, `${currentSuspect.name} reacted strongly to "${currentSuspect.clueTrigger}"`]);
                    }

                } catch (err) {
                    console.error(err);
                } finally {
                    setIsThinking(false);
                }
            };

            if (status === 'generating') return (
                <div className="h-screen flex flex-col items-center justify-center bg-black">
                    <div className="w-12 h-12 border-2 border-amber-900 border-t-amber-500 rounded-full animate-spin mb-4" />
                    <p className="font-typewriter text-amber-500 animate-pulse uppercase tracking-widest text-sm">Mistral is fabricating a new crime scene...</p>
                </div>
            );

            if (status === 'error') return (
                <div className="h-screen flex flex-col items-center justify-center text-red-500 font-typewriter">
                    <p>CONNECTION FAILED</p>
                    <p className="text-xs text-zinc-600 mt-2">Ensure Ollama is running with OLLAMA_ORIGINS="*"</p>
                    <button onClick={() => window.location.reload()} className="mt-4 border border-red-900 px-4 py-1 hover:bg-red-900/20">RETRY</button>
                </div>
            );

            if (!crimeScene) return null;

            return (
                <div className="flex h-screen overflow-hidden bg-zinc-950">
                    {/* LEFT PANEL: Case Details & Suspects */}
                    <div className="w-80 border-r border-zinc-900 flex flex-col bg-zinc-950">
                        <div className="p-6 border-b border-zinc-900">
                            <h1 className="text-zinc-100 font-typewriter text-xl tracking-tighter uppercase">{crimeScene.location}</h1>
                            <p className="text-[10px] text-zinc-600 font-bold mt-1 tracking-widest uppercase">The {crimeScene.victim} Investigation</p>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            <div>
                                <h2 className="text-[10px] text-amber-600 font-bold uppercase mb-3 px-2">Suspect Pool</h2>
                                <div className="space-y-1">
                                    {crimeScene.suspects.map(s => (
                                        <button 
                                            key={s.id} 
                                            onClick={() => setActiveSuspectId(s.id)}
                                            className={`w-full text-left p-3 rounded-lg text-xs transition-all border ${activeSuspectId === s.id ? 'bg-zinc-900 border-zinc-800 text-zinc-100 shadow-xl' : 'border-transparent text-zinc-500 hover:text-zinc-300'}`}
                                        >
                                            <div className="font-bold">{s.name}</div>
                                            <div className="text-[10px] opacity-60 uppercase">{s.role}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <h2 className="text-[10px] text-zinc-600 font-bold uppercase mb-3 px-2">Evidence Log</h2>
                                <div className="space-y-2">
                                    <div className="text-[10px] bg-zinc-900/50 p-2 border border-zinc-900 rounded italic text-zinc-500">
                                        Found: {crimeScene.weapon} near the body.
                                    </div>
                                    {evidence.map((e, i) => (
                                        <div key={i} className="text-[10px] bg-amber-900/10 p-2 border border-amber-900/20 rounded text-amber-200 animate-slide-up">
                                            {e}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MAIN PANEL: The Interrogation */}
                    <div className="flex-1 flex flex-col relative">
                        <div className="h-16 border-b border-zinc-900 flex items-center justify-between px-8 bg-zinc-950/50 backdrop-blur">
                            <div className="flex items-center gap-4">
                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(220,38,38,0.8)]" />
                                <span className="font-typewriter text-zinc-400 text-sm uppercase">Record Mode: {crimeScene.suspects.find(s => s.id === activeSuspectId).name}</span>
                            </div>
                            <div className="text-[10px] font-mono text-zinc-700">OLLAMA // MISTRAL-v0.3</div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
                            {history[activeSuspectId].length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center opacity-20 select-none pointer-events-none">
                                    <h2 className="text-4xl font-typewriter text-zinc-700 mb-2">{crimeScene.suspects.find(s => s.id === activeSuspectId).name}</h2>
                                    <p className="text-xs uppercase tracking-[0.2em]">{crimeScene.suspects.find(s => s.id === activeSuspectId).role}</p>
                                </div>
                            )}

                            {history[activeSuspectId].map((m, i) => (
                                <div key={i} className={`flex w-full ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up`}>
                                    <div className={`max-w-xl group relative`}>
                                        <div className={`text-[9px] mb-1 uppercase tracking-widest font-bold ${m.role === 'user' ? 'text-right text-zinc-600' : 'text-zinc-500'}`}>
                                            {m.role === 'user' ? 'Detective Srijan' : crimeScene.suspects.find(s => s.id === activeSuspectId).name}
                                        </div>
                                        <div className={`p-4 rounded-xl text-sm leading-relaxed ${
                                            m.role === 'user' 
                                            ? 'bg-zinc-100 text-zinc-950 rounded-tr-none font-medium' 
                                            : 'bg-zinc-900 text-zinc-300 rounded-tl-none border border-zinc-800 italic'
                                        }`}>
                                            {m.content}
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {isThinking && (
                                <div className="flex gap-1.5 p-2 bg-zinc-900/30 rounded-lg w-fit">
                                    <div className="typing-dot" style={{animationDelay: '0s'}} />
                                    <div className="typing-dot" style={{animationDelay: '0.2s'}} />
                                    <div className="typing-dot" style={{animationDelay: '0.4s'}} />
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        <div className="p-8">
                            <form onSubmit={sendMessage} className="max-w-4xl mx-auto flex gap-3">
                                <input 
                                    className="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg p-4 text-sm text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-amber-900 focus:ring-1 focus:ring-amber-900/50 transition-all" 
                                    placeholder="Enter your interrogation query..." 
                                    value={input} 
                                    onChange={e => setInput(e.target.value)}
                                    disabled={isThinking}
                                />
                                <button 
                                    className="bg-zinc-100 text-zinc-950 px-6 rounded-lg font-bold hover:bg-white transition-colors disabled:opacity-20"
                                    disabled={isThinking || !input.trim()}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
