<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor of Whispers: Procedural Engine</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #a1a1aa; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; width: 4px; height: 4px; background: #71717a; border-radius: 50%; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const OLLAMA_URL = "http://localhost:11434/api/chat";
        const MODEL = "llama3.1:latest";

        const Icons = {
            ShieldAlert: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Cpu: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1V4"/><path d="M15 1V4"/><path d="M9 20V23"/><path d="M15 20V23"/><path d="M20 9H23"/><path d="M20 14H23"/><path d="M1 9H4"/><path d="M1 14H4"/></svg>,
            Zap: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Loader2: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            BookOpen: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Send: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Gavel: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m14 13-5 5"/><path d="m3 21 2-2"/><path d="m9 15 10-10a2 2 0 1 1 3 3L12 18l-3-3Z"/><path d="m15 4 5 5"/><path d="m2 11 7 7"/></svg>,
        };

        const { BookOpen, Send, Loader2, ShieldAlert, Cpu, Zap, Gavel } = Icons;

        const formatVal = (val) => (typeof val === 'string' ? val : (val?.name || val?.title || "Unknown"));

        function LoadingScreen({ status, onStart, onStartLite }) {
            return (
                <div className="fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center p-6 z-50 text-center">
                    <div className="max-w-md w-full space-y-8 animate-fade-in">
                        <div>
                            <h1 className="text-4xl font-typewriter text-amber-500 mb-2 tracking-widest uppercase">Manor of Whispers</h1>
                            <p className="text-zinc-500 text-xs tracking-[0.3em] uppercase font-bold">Procedural Investigation Engine</p>
                        </div>

                        {status === 'initializing' ? (
                            <div className="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-2xl space-y-4">
                                <ShieldAlert className="w-12 h-12 text-amber-600 mx-auto" />
                                <div className="space-y-2 mb-6">
                                    <h3 className="text-lg font-bold text-zinc-100">Detective Srijan, select your engine.</h3>
                                    <p className="text-zinc-500 text-sm">Full mode requires local Ollama server running.</p>
                                </div>
                                <button onClick={onStart} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                    <Cpu size={18} /> Full Neural Engine
                                </button>
                                <button onClick={onStartLite} className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                    <Zap size={18} /> Lite Script Mode
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <Loader2 className="animate-spin text-amber-600 mx-auto" size={40} />
                                <p className="font-typewriter text-amber-500 text-sm uppercase tracking-widest animate-pulse">Constructing Crime Scene...</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [status, setStatus] = useState('initializing');
            const [mode, setMode] = useState(null);
            const [crimeScene, setCrimeScene] = useState(null);
            const [activeSuspectId, setActiveSuspectId] = useState(null);
            const [history, setHistory] = useState({});
            const [input, setInput] = useState("");
            const [isThinking, setIsThinking] = useState(false);
            const [evidence, setEvidence] = useState([]);
            const [hasConfessed, setHasConfessed] = useState({});
            const [gameState, setGameState] = useState('playing'); // playing, won, lost
            const chatEndRef = useRef(null);

            const generateWorld = async (isLite = false) => {
                setStatus('generating');
                setMode(isLite ? 'lite' : 'full');
                
                if (isLite) {
                    setTimeout(() => {
                        setupGame({
                            victim: "Arthur Pennyworth",
                            location: "Willow Creek Manor",
                            weapon: "Poisoned Sherry",
                            suspects: [
                                { id: 's1', name: "Lady Vivian", role: "The Widow", isKiller: true, clueTrigger: "will" },
                                { id: 's2', name: "James", role: "The Butler", isKiller: false, clueTrigger: "dress" },
                                { id: 's3', name: "Robert Sterling", role: "Business Partner", isKiller: false, clueTrigger: "ledger" }
                            ]
                        });
                    }, 1200);
                    return;
                }

                try {
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL,
                            format: "json",
                            stream: false,
                            messages: [{ role: "user", content: "Generate a murder mystery JSON. String victim, string location, string weapon. Array of 3 suspects with string id, name, role, secret, boolean isKiller (exactly one true), and string clueTrigger. Return JSON only." }]
                        })
                    });
                    const data = await response.json();
                    setupGame(JSON.parse(data.message.content));
                } catch (err) {
                    setStatus('initializing');
                    alert("Connection to Ollama failed. Please ensure the server is running with OLLAMA_ORIGINS=\"*\"");
                }
            };

            const setupGame = (scene) => {
                setCrimeScene(scene);
                setActiveSuspectId(scene.suspects[0].id);
                const initialHistory = {};
                scene.suspects.forEach(s => initialHistory[s.id] = []);
                setHistory(initialHistory);
                setStatus('playing');
            };

            const handleResponse = (reply, suspect) => {
                setHistory(prev => ({
                    ...prev,
                    [activeSuspectId]: [...prev[activeSuspectId], { role: 'assistant', content: reply }]
                }));

                const isTriggered = reply.toLowerCase().includes(suspect.clueTrigger.toLowerCase());
                if (isTriggered) {
                    setEvidence(prev => {
                        const note = `${suspect.name} reacted to: "${suspect.clueTrigger}"`;
                        return prev.includes(note) ? prev : [...prev, note];
                    });
                    
                    // Mark as confessed for the UI lock
                    setHasConfessed(prev => ({ ...prev, [suspect.id]: true }));
                }
                setIsThinking(false);
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isThinking || gameState !== 'playing') return;

                const currentSuspect = crimeScene.suspects.find(s => s.id === activeSuspectId);
                const userMsg = { role: 'user', content: input };
                setInput("");
                
                setHistory(prev => ({ ...prev, [activeSuspectId]: [...prev[activeSuspectId], userMsg] }));
                setIsThinking(true);

                if (mode === 'lite') {
                    setTimeout(() => {
                        const reply = input.toLowerCase().includes(currentSuspect.clueTrigger.toLowerCase()) 
                            ? `I... I can't keep this secret anymore. Yes! I killed them! I killed ${formatVal(crimeScene.victim)}!` 
                            : `I have nothing to hide, Detective. Why are you bothering me?`;
                        handleResponse(reply, currentSuspect);
                    }, 800);
                    return;
                }

                try {
                    const systemPrompt = `You are ${currentSuspect.name}, the ${currentSuspect.role}. ${formatVal(crimeScene.victim)} was killed with ${formatVal(crimeScene.weapon)}. ${currentSuspect.isKiller ? "You are the killer. You will confess ONLY if the detective mentions " + currentSuspect.clueTrigger : "You are innocent but suspicious."} Speak in 2 sentences.`;
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL,
                            stream: false,
                            messages: [{ role: 'system', content: systemPrompt }, ...history[activeSuspectId], userMsg]
                        })
                    });
                    const data = await response.json();
                    handleResponse(data.message.content, currentSuspect);
                } catch (err) {
                    setIsThinking(false);
                }
            };

            const handleAccuse = (suspect) => {
                if (!hasConfessed[suspect.id]) return;
                setGameState(suspect.isKiller ? 'won' : 'lost');
            };

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history, activeSuspectId, isThinking]);

            if (status !== 'playing') return <LoadingScreen status={status} onStart={() => generateWorld(false)} onStartLite={() => generateWorld(true)} />;

            const currentSuspect = crimeScene.suspects.find(s => s.id === activeSuspectId);

            return (
                <div className="flex h-screen bg-zinc-950 overflow-hidden relative">
                    {/* VERDICT OVERLAY */}
                    {gameState !== 'playing' && (
                        <div className="absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-8 animate-fade-in text-center">
                            <div className="max-w-2xl">
                                <h2 className={`text-7xl font-typewriter mb-6 ${gameState === 'won' ? 'text-amber-500' : 'text-red-600'}`}>
                                    {gameState === 'won' ? 'CASE CLOSED' : 'FAILURE'}
                                </h2>
                                <p className="text-zinc-400 text-lg leading-relaxed mb-10 font-medium">
                                    {gameState === 'won' 
                                        ? `Congratulations, Detective Srijan. You successfully navigated the web of lies at ${formatVal(crimeScene.location)} and secured a full confession from the murderer.`
                                        : `Your accusation was premature or targeted the wrong suspect. The investigation has collapsed, and the true killer remains at large.`}
                                </p>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="bg-zinc-100 text-zinc-950 px-10 py-4 rounded-2xl font-bold hover:bg-white transition-all scale-110 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.2)]"
                                >
                                    NEW INVESTIGATION
                                </button>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR */}
                    <div className="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col hidden md:flex">
                        <div className="p-6 border-b border-zinc-800 bg-zinc-900/50 backdrop-blur">
                            <h2 className="text-lg font-typewriter text-amber-500 font-bold tracking-tight uppercase truncate">{formatVal(crimeScene.location)}</h2>
                            <p className="text-[10px] text-zinc-500 mt-1 uppercase tracking-widest font-bold">Victim: {formatVal(crimeScene.victim)}</p>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 scrollbar-hide">
                            <h3 className="text-[10px] font-bold text-zinc-600 px-2 uppercase tracking-[0.2em] mb-4">The Suspects</h3>
                            {crimeScene.suspects.map(s => (
                                <div key={s.id} className="relative group">
                                    <button
                                        onClick={() => setActiveSuspectId(s.id)}
                                        className={`w-full text-left p-4 rounded-2xl border transition-all duration-300 flex items-center gap-4 ${
                                            activeSuspectId === s.id 
                                            ? 'bg-amber-900/10 border-amber-600/50 ring-1 ring-amber-600/20' 
                                            : 'bg-zinc-800/30 border-transparent hover:bg-zinc-800'
                                        }`}
                                    >
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-lg ${activeSuspectId === s.id ? 'bg-amber-600' : 'bg-zinc-700'}`}>
                                            {s.name[0]}
                                        </div>
                                        <div className="flex-1">
                                            <div className={`font-bold text-sm ${activeSuspectId === s.id ? 'text-amber-500' : 'text-zinc-300'}`}>{s.name}</div>
                                            <div className="text-[10px] text-zinc-500 uppercase font-semibold">{s.role}</div>
                                        </div>
                                    </button>
                                    
                                    {/* ACCUSE BUTTON: ONLY ACTIVE AFTER CONFESSION */}
                                    <button 
                                        onClick={() => handleAccuse(s)}
                                        disabled={!hasConfessed[s.id]}
                                        className={`absolute right-3 top-1/2 -translate-y-1/2 p-2.5 rounded-xl transition-all shadow-xl ${
                                            hasConfessed[s.id] 
                                            ? 'bg-red-600 text-white hover:bg-red-500 hover:scale-110 active:scale-90 opacity-100' 
                                            : 'bg-zinc-800 text-zinc-600 opacity-0 group-hover:opacity-40 cursor-not-allowed'
                                        }`}
                                        title={hasConfessed[s.id] ? "Final Accusation" : "Suspect has not confessed"}
                                    >
                                        <Gavel size={14} />
                                    </button>
                                </div>
                            ))}

                            <div className="mt-8 p-5 bg-zinc-950/50 rounded-2xl border border-zinc-800 shadow-inner">
                                <div className="flex items-center gap-2 mb-4 text-amber-600 font-bold text-[10px] tracking-widest">
                                    <BookOpen size={14} /> EVIDENCE LOG
                                </div>
                                <div className="space-y-2">
                                    <div className="p-3 bg-zinc-900/80 rounded-xl border border-zinc-800 italic text-[10px] opacity-70">
                                        Weapon Found: {formatVal(crimeScene.weapon)}
                                    </div>
                                    {evidence.map((e, i) => (
                                        <div key={i} className="p-3 bg-amber-900/10 rounded-xl border border-amber-900/20 text-amber-200 animate-fade-in text-[10px] flex gap-2">
                                            <span>✓</span> {e}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* INTERROGATION HUB */}
                    <div className="flex-1 flex flex-col relative bg-zinc-950">
                        <div className="h-16 border-b border-zinc-900 flex items-center justify-between px-8 bg-zinc-950/50 backdrop-blur z-10">
                            <div className="flex items-center gap-4">
                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(220,38,38,0.8)]" />
                                <span className="font-typewriter text-zinc-400 text-sm uppercase tracking-wide">
                                    Room A: {currentSuspect.name}
                                </span>
                            </div>
                            <div className="text-[10px] font-mono text-zinc-700 uppercase tracking-[0.2em]">{mode} engine</div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-8 space-y-8 scrollbar-hide">
                            {history[activeSuspectId].length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center opacity-10 select-none pointer-events-none">
                                    <h2 className="text-5xl font-typewriter text-zinc-600 mb-2 uppercase text-center">{currentSuspect.name}</h2>
                                    <p className="text-xs uppercase tracking-[0.5em] font-bold">{currentSuspect.role}</p>
                                </div>
                            )}

                            {history[activeSuspectId].map((m, i) => (
                                <div key={i} className={`flex w-full ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                    <div className="max-w-xl group">
                                        <div className={`text-[9px] mb-1 uppercase tracking-[0.2em] font-bold ${m.role === 'user' ? 'text-right text-zinc-600' : 'text-zinc-500'}`}>
                                            {m.role === 'user' ? 'Det. Srijan Das' : currentSuspect.name}
                                        </div>
                                        <div className={`p-5 rounded-2xl text-sm leading-relaxed shadow-lg ${
                                            m.role === 'user' 
                                            ? 'bg-amber-700 text-white rounded-tr-none' 
                                            : 'bg-zinc-900 text-zinc-300 border border-zinc-800 rounded-tl-none italic'
                                        }`}>
                                            {m.content}
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {isThinking && (
                                <div className="flex gap-2 p-4 bg-zinc-900 rounded-2xl w-fit border border-zinc-800 shadow-xl">
                                    <div className="typing-dot" style={{animationDelay: '0s'}} />
                                    <div className="typing-dot" style={{animationDelay: '0.2s'}} />
                                    <div className="typing-dot" style={{animationDelay: '0.4s'}} />
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        <div className="p-8 bg-gradient-to-t from-zinc-950 via-zinc-950 to-transparent">
                            <form onSubmit={sendMessage} className="max-w-4xl mx-auto flex gap-4">
                                <input 
                                    className="flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-amber-900 focus:ring-1 focus:ring-amber-900/50 transition-all disabled:opacity-30" 
                                    placeholder={gameState !== 'playing' ? "Investigation Terminated" : `Press ${currentSuspect.name} for answers...`} 
                                    value={input} 
                                    onChange={e => setInput(e.target.value)}
                                    disabled={isThinking || gameState !== 'playing'}
                                />
                                <button 
                                    className="bg-zinc-100 text-zinc-950 px-8 rounded-2xl font-bold hover:bg-white transition-all shadow-xl hover:scale-105 active:scale-95 disabled:opacity-20"
                                    disabled={isThinking || !input.trim() || gameState !== 'playing'}
                                >
                                    <Send size={20} />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
