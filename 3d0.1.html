<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor of Whispers FPS - Detective Srijan Das</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid #000; }
        .interaction-prompt { position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); color: #fbbf24; font-weight: bold; text-shadow: 2px 2px #000; font-size: 14px; letter-spacing: 0.1em; }
        .ui-panel { pointer-events: auto; background: rgba(10, 10, 15, 0.98); border: 1px solid #3f3f46; box-shadow: 0 0 40px rgba(0,0,0,1); }
        .scanline { position: absolute; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px; pointer-events: none; opacity: 0.2; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; width: 4px; height: 4px; background: #71717a; border-radius: 50%; margin: 0 2px; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .glass { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const OLLAMA_URL = "http://localhost:11434/api/chat";
        const MODEL = "llama3.1:latest";

        const formatVal = (val) => {
            if (!val) return "";
            if (typeof val === 'string') return val;
            if (typeof val === 'object') {
                if (val.name && val.occupation) return `${val.name} (${val.occupation}, age ${val.age || '?'})`;
                if (val.name) return val.name;
                return val.title || val.item || val.description || val.text || JSON.stringify(val);
            }
            return String(val);
        };

        const cleanJSON = (str) => {
            try {
                const match = str.match(/\{[\s\S]*\}/);
                return match ? match[0] : str;
            } catch (e) { return str; }
        };

        function App() {
            const [status, setStatus] = useState('initializing');
            const [crimeScene, setCrimeScene] = useState(null);
            const [activeUI, setActiveUI] = useState(null); 
            const [activeSuspect, setActiveSuspect] = useState(null);
            const [conversations, setConversations] = useState({});
            const [evidence, setEvidence] = useState([]);
            const [completedActions, setCompletedActions] = useState(new Set());
            const [isThinking, setIsThinking] = useState(false);
            const [interactionText, setInteractionText] = useState("");
            
            const canvasRef = useRef();
            const mountRef = useRef(false);
            const uiRef = useRef(null); 

            const stateRef = useRef({ 
                moveForward: false, moveBackward: false, moveLeft: false, moveRight: false,
                pitch: 0, yaw: 0, camera: null, interactables: [], doors: [] 
            });

            useEffect(() => { uiRef.current = activeUI; }, [activeUI]);

            const initMystery = async () => {
                setStatus('generating');
                try {
                    const prompt = `Generate a murder mystery JSON. Include: victim (string), location (string), weapon (string), motive (string), fullStory (string), investigativeActions (array of 4: id, task, result), suspects (array of 4: id, name, role, secret, isKiller, clueTrigger). JSON ONLY.`;
                    const res = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: MODEL, format: "json", stream: false, messages: [{ role: "user", content: prompt }] })
                    });
                    const data = await res.json();
                    const scene = JSON.parse(cleanJSON(data.message.content));
                    setCrimeScene(scene);
                    const h = {}; scene.suspects.forEach(s => h[s.id] = []);
                    setConversations(h);
                    setStatus('playing');
                } catch (e) {
                    alert("Ollama Error. Ensure Ollama is running with CORS allowed.");
                    setStatus('initializing');
                }
            };

            useEffect(() => {
                if (status !== 'playing' || mountRef.current) return;
                mountRef.current = true;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a1a);
                scene.fog = new THREE.Fog(0x1a1a1a, 5, 45);

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                stateRef.current.camera = camera;
                camera.position.set(0, 1.7, 0); 

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                canvasRef.current.appendChild(renderer.domElement);

                /* --- LIGHTING --- */
                scene.add(new THREE.AmbientLight(0x444444));
                const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
                scene.add(hemiLight);

                const addPointLight = (x, y, z, color, intensity, distance) => {
                    const light = new THREE.PointLight(color, intensity, distance);
                    light.position.set(x, y, z);
                    scene.add(light);
                    return light;
                };

                addPointLight(0, 4, 0, 0xffffff, 2.0, 20); // Lobby
                addPointLight(0, 4, -12, 0x6666ff, 2.5, 25); // Interrogation
                addPointLight(0, 4, 12, 0x66ff66, 2.5, 25); // Briefing
                addPointLight(-12, 4, 0, 0x00ffff, 2.5, 25); // Lab
                addPointLight(12, 4, 0, 0xffaa00, 3.0, 25); // Boss

                const createBox = (w, h, d, x, y, z, color = 0x222222) => {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.5 }));
                    mesh.position.set(x, y, z);
                    scene.add(mesh);
                    return mesh;
                };

                const createStickFigure = (x, z, color = 0xaaaaaa) => {
                    const group = new THREE.Group();
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshStandardMaterial({ color }));
                    head.position.y = 1.7;
                    group.add(head);
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.0), new THREE.MeshStandardMaterial({ color }));
                    body.position.y = 1.0;
                    group.add(body);
                    group.position.set(x, 0, z);
                    scene.add(group);
                    return group;
                };

                /* --- ARCHITECTURE --- */
                createBox(50, 0.1, 50, 0, 0, 0, 0x222222); // Floor
                createBox(50, 0.1, 50, 0, 5, 0, 0x1a1a1a); // Ceiling

                // Outer Walls
                createBox(40, 5, 1, 0, 2.5, -18, 0x2a2a2a); 
                createBox(40, 5, 1, 0, 2.5, 18, 0x2a2a2a);  
                createBox(1, 5, 40, -18, 2.5, 0, 0x2a2a2a); 
                createBox(1, 5, 40, 18, 2.5, 0, 0x2a2a2a);  

                // Room Dividers
                createBox(10, 5, 0.5, -10, 2.5, -5, 0x333333); 
                createBox(10, 5, 0.5, 10, 2.5, -5, 0x333333);  
                createBox(10, 5, 0.5, -10, 2.5, 5, 0x333333);  
                createBox(10, 5, 0.5, 10, 2.5, 5, 0x333333);   

                // Wings
                createBox(0.5, 5, 20, -5, 2.5, -15, 0x2a2a2a); 
                createBox(0.5, 5, 20, 5, 2.5, -15, 0x2a2a2a);  
                createBox(10, 5, 0.5, 0, 2.5, -25, 0x2a2a2a); 
                
                for(let i=0; i<4; i++) {
                    const zOff = -8 - (i * 4);
                    createBox(3, 5, 0.5, -6.5, 2.5, zOff, 0x222222); 
                }

                createBox(10, 5, 0.5, 0, 2.5, 15, 0x333333); 
                createBox(0.5, 5, 10, -5, 2.5, 10, 0x333333);
                createBox(0.5, 5, 10, 5, 2.5, 10, 0x333333);
                createBox(0.5, 5, 10, -15, 2.5, 0, 0x333333);
                createBox(0.5, 5, 10, 15, 2.5, 0, 0x333333);

                const interactables = [];
                const addInteractable = (mesh, name, type, data = null) => {
                    mesh.userData = { name, type, data };
                    interactables.push(mesh);
                    return mesh;
                };

                const doors = [];
                const createProperDoor = (name, x, z, rotationY, hingeOffset = -0.9) => {
                    // Pivot group (The Hinge)
                    const hinge = new THREE.Group();
                    hinge.position.set(x, 1.6, z);
                    hinge.rotation.y = rotationY;
                    scene.add(hinge);

                    // Door mesh (Offset so it rotates at edge)
                    const doorGeo = new THREE.BoxGeometry(1.8, 3.2, 0.15);
                    const doorMat = new THREE.MeshStandardMaterial({ color: 0x4b3621, roughness: 0.9, metalness: 0.1 });
                    const doorMesh = new THREE.Mesh(doorGeo, doorMat);
                    doorMesh.position.set(-hingeOffset, 0, 0); 
                    hinge.add(doorMesh);

                    // Handle
                    const handleGeo = new THREE.SphereGeometry(0.08, 8, 8);
                    const handleMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1 });
                    const handle = new THREE.Mesh(handleGeo, handleMat);
                    handle.position.set(-hingeOffset * 1.6, 0, 0.1);
                    doorMesh.add(handle);

                    // Frame
                    const frame = new THREE.Mesh(new THREE.BoxGeometry(2, 3.4, 0.3), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                    frame.position.set(x, 1.7, z);
                    frame.rotation.y = rotationY;
                    scene.add(frame);

                    const doorData = { open: false, targetRot: rotationY };
                    doorMesh.userData = { name, type: "door", data: doorData, pivot: hinge, startRot: rotationY };
                    interactables.push(doorMesh);
                    doors.push(doorMesh);
                    return hinge;
                };

                // Doors placement
                createProperDoor("Door: Briefing", 0, 5, 0);
                createStickFigure(0, 12, 0x4ade80);
                const briefT = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshBasicMaterial({ visible: false }));
                briefT.position.set(0, 1, 12); scene.add(briefT);
                addInteractable(briefT, "Duty Sergeant", "briefing");

                crimeScene.suspects.forEach((s, i) => {
                    const zOff = -8 - (i * 4);
                    createProperDoor(`Cell ${i+1}`, -5, zOff, Math.PI/2);
                    createStickFigure(-7, zOff, 0xcccccc);
                    const chatT = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 1.5), new THREE.MeshBasicMaterial({ visible: false }));
                    chatT.position.set(-7, 1.25, zOff); scene.add(chatT);
                    addInteractable(chatT, `Interrogate ${formatVal(s.name)}`, "chat", s);
                });

                createProperDoor("Door: Control Room", -5, 0, Math.PI/2);
                const terminal = createBox(0.8, 1, 1.2, -13, 0.5, 0, 0x00ffff);
                addInteractable(terminal, "Forensic Terminal", "actions");

                createProperDoor("Door: Commissioner", 5, 0, Math.PI/2);
                createStickFigure(13, 0, 0xf87171);
                const bossT = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 1.5), new THREE.MeshBasicMaterial({ visible: false }));
                bossT.position.set(13, 1.25, 0); scene.add(bossT);
                addInteractable(bossT, "Commissioner", "boss");

                stateRef.current.doors = doors;

                const onMouseMove = (e) => {
                    if (document.pointerLockElement === renderer.domElement) {
                        stateRef.current.yaw -= e.movementX * 0.002;
                        stateRef.current.pitch -= e.movementY * 0.002;
                        stateRef.current.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, stateRef.current.pitch));
                    }
                };
                const onKey = (e, val) => {
                    if (e.code === 'KeyW') stateRef.current.moveForward = val;
                    if (e.code === 'KeyS') stateRef.current.moveBackward = val;
                    if (e.code === 'KeyA') stateRef.current.moveLeft = val;
                    if (e.code === 'KeyD') stateRef.current.moveRight = val;
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('keydown', (e) => onKey(e, true));
                window.addEventListener('keyup', (e) => onKey(e, false));

                const raycaster = new THREE.Raycaster();
                const vel = new THREE.Vector3();
                const dir = new THREE.Vector3();
                
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    if (document.pointerLockElement === renderer.domElement && !uiRef.current) {
                        camera.rotation.set(stateRef.current.pitch, stateRef.current.yaw, 0, 'YXZ');
                        vel.x -= vel.x * 10 * 0.016;
                        vel.z -= vel.z * 10 * 0.016;
                        dir.z = Number(stateRef.current.moveForward) - Number(stateRef.current.moveBackward);
                        dir.x = Number(stateRef.current.moveRight) - Number(stateRef.current.moveLeft);
                        dir.normalize();

                        if (stateRef.current.moveForward || stateRef.current.moveBackward) vel.z -= dir.z * 50 * 0.016;
                        if (stateRef.current.moveLeft || stateRef.current.moveRight) vel.x -= dir.x * 50 * 0.016;

                        camera.translateX(-vel.x * 0.016);
                        camera.translateZ(vel.z * 0.016); 
                        camera.position.y = 1.7;

                        camera.position.x = Math.max(-18, Math.min(18, camera.position.x));
                        camera.position.z = Math.max(-23, Math.min(18, camera.position.z));

                        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                        const hits = raycaster.intersectObjects(interactables);
                        if (hits.length > 0 && hits[0].distance < 4.0) {
                            setInteractionText(`[CLICK] ${hits[0].object.userData.name}`);
                        } else setInteractionText("");
                    }

                    // Animate swinging doors
                    stateRef.current.doors.forEach(d => {
                        const data = d.userData.data;
                        const pivot = d.userData.pivot;
                        const target = data.open ? d.userData.startRot + Math.PI/1.8 : d.userData.startRot;
                        pivot.rotation.y = THREE.MathUtils.lerp(pivot.rotation.y, target, 0.1);
                    });

                    renderer.render(scene, camera);
                };
                animate();

                const onClick = () => {
                    if (document.pointerLockElement !== renderer.domElement) return;
                    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                    const hits = raycaster.intersectObjects(interactables);
                    if (hits.length > 0 && hits[0].distance < 4.0) {
                        const d = hits[0].object.userData;
                        if (d.type === 'door') {
                            d.data.open = !d.data.open;
                        } else {
                            if (d.type === 'chat') setActiveSuspect(d.data);
                            setActiveUI(d.type);
                            document.exitPointerLock();
                        }
                    }
                };
                renderer.domElement.addEventListener('click', onClick);

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', onResize);
            }, [status]);

            const chat = async (msg) => {
                if (!msg.trim() || isThinking) return;
                const s = activeSuspect;
                setConversations(p => ({ ...p, [s.id]: [...p[s.id], { role: 'user', content: msg }] }));
                setIsThinking(true);
                try {
                    const res = await fetch(OLLAMA_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL, stream: false,
                            messages: [{ role: 'system', content: `You are ${formatVal(s.name)}. Secret: ${formatVal(s.secret)}. If user says "${formatVal(s.clueTrigger)}", reveal it. Max 2 sentences.` }, ...conversations[s.id], { role: 'user', content: msg }]
                        })
                    });
                    const d = await res.json();
                    const reply = d.message.content;
                    setConversations(p => ({ ...p, [s.id]: [...p[s.id], { role: 'assistant', content: reply }] }));
                    if (reply.toLowerCase().includes(formatVal(s.clueTrigger).toLowerCase())) {
                        setEvidence(prev => [...new Set([...prev, `Lead: ${formatVal(s.name)} revealed secret.`])]);
                        setHasConfessed(prev => ({ ...prev, [s.id]: true }));
                    }
                } finally { setIsThinking(false); }
            };

            if (status !== 'playing') return <LoadingScreen status={status} onStart={initMystery} />;

            return (
                <div className="relative w-screen h-screen bg-zinc-900">
                    <div ref={canvasRef} className="w-full h-full" onClick={(e) => {
                        if (!activeUI) e.target.requestPointerLock();
                    }} />
                    
                    <div className="hud-overlay">
                        <div className="crosshair" />
                        <div className="scanline" />
                        {interactionText && <div className="interaction-prompt font-typewriter">{interactionText}</div>}

                        <div className="absolute top-6 left-6 glass p-4 rounded-xl ui-element w-64 border-l-4 border-amber-600">
                            <p className="text-[9px] text-zinc-500 uppercase font-bold tracking-widest mb-1">Detective Srijan Das</p>
                            <p className="text-zinc-100 font-bold text-xs uppercase tracking-tighter">Site: Precinct Alpha</p>
                        </div>

                        <div className="absolute top-6 right-6 glass p-4 rounded-xl ui-element w-64 max-h-[250px] overflow-y-auto custom-scrollbar pr-2">
                            <p className="text-[9px] text-amber-500 uppercase font-bold mb-2">Evidence Case File</p>
                            <div className="space-y-1.5">
                                {evidence.map((e, i) => <div key={i} className="text-[10px] bg-white/5 p-2 rounded border border-white/5 leading-tight">{formatVal(e)}</div>)}
                                {evidence.length === 0 && <p className="text-[9px] text-zinc-600 italic px-1">Interrogate suspects for leads...</p>}
                            </div>
                        </div>

                        {activeUI && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/50 pointer-events-none p-4 z-50">
                                <div className="ui-panel p-8 rounded-3xl w-full max-w-2xl animate-fade-in pointer-events-auto relative shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                                    <button onClick={() => setActiveUI(null)} className="absolute top-6 right-6 text-zinc-600 hover:text-white uppercase text-[9px] font-bold tracking-widest">Resume [ESC]</button>
                                    
                                    {activeUI === 'briefing' && (
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-typewriter text-amber-500 uppercase">Case Briefing</h2>
                                            <div className="p-6 bg-zinc-900/50 rounded-2xl border border-zinc-800 italic text-zinc-300 leading-relaxed text-sm shadow-inner">
                                                {formatVal(crimeScene.fullStory)}
                                            </div>
                                            <div className="grid grid-cols-2 gap-4 text-[10px] text-zinc-500 font-bold uppercase tracking-widest">
                                                <div className="p-3 border border-zinc-800 rounded-lg bg-zinc-900/30">Target: <span className="text-zinc-200">{formatVal(crimeScene.victim)}</span></div>
                                                <div className="p-3 border border-zinc-800 rounded-lg bg-zinc-900/30">Weapon: <span className="text-zinc-200">{formatVal(crimeScene.weapon)}</span></div>
                                            </div>
                                        </div>
                                    )}

                                    {activeUI === 'chat' && activeSuspect && (
                                        <div className="flex flex-col h-[400px]">
                                            <div className="mb-4">
                                                <h2 className="text-lg font-typewriter text-amber-500">{formatVal(activeSuspect.name)}</h2>
                                                <p className="text-[10px] text-zinc-500 uppercase">{formatVal(activeSuspect.role)}</p>
                                            </div>
                                            <div className="flex-1 overflow-y-auto space-y-4 mb-4 pr-2 custom-scrollbar">
                                                {conversations[activeSuspect.id].map((m, i) => (
                                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                        <div className={`max-w-[85%] p-3 rounded-2xl text-xs ${m.role === 'user' ? 'bg-amber-700 text-white shadow-lg' : 'bg-zinc-800 text-zinc-200 border border-zinc-700 shadow-md'}`}>
                                                            {formatVal(m.content)}
                                                        </div>
                                                    </div>
                                                ))}
                                                {isThinking && <div className="flex p-2 gap-1"><div className="typing-dot"/><div className="typing-dot"/><div className="typing-dot"/></div>}
                                            </div>
                                            <form onSubmit={(e) => { e.preventDefault(); chat(e.target.m.value); e.target.m.value=''; }} className="flex gap-2">
                                                <input name="m" className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-600 transition-colors" placeholder="Ask a question..." autoFocus />
                                                <button className="bg-amber-600 text-white px-5 rounded-xl font-bold uppercase text-[10px] shadow-lg shadow-amber-900/20 hover:bg-amber-500 transition-all">Send</button>
                                            </form>
                                        </div>
                                    )}

                                    {activeUI === 'actions' && (
                                        <div className="space-y-4">
                                            <h2 className="text-xl font-typewriter text-zinc-200 uppercase">Database Terminal</h2>
                                            <div className="grid grid-cols-2 gap-3">
                                                {crimeScene.investigativeActions.map(a => (
                                                    <button key={a.id} onClick={() => { setCompletedActions(p => new Set([...p, a.id])); setEvidence(e => [...new Set([...e, a.result])]); }} 
                                                        disabled={completedActions.has(a.id)}
                                                        className={`p-4 border rounded-2xl text-left transition-all ${completedActions.has(a.id) ? 'bg-zinc-900 border-zinc-800 opacity-40' : 'bg-zinc-900/50 border-zinc-800 hover:border-amber-600 hover:bg-amber-900/10'}`}>
                                                        <p className="text-[11px] font-bold text-zinc-100 mb-1">{formatVal(a.task)}</p>
                                                        {completedActions.has(a.id) && <p className="text-[9px] text-amber-500 italic mt-2 border-t border-amber-900/20 pt-2">{formatVal(a.result)}</p>}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {activeUI === 'boss' && (
                                        <div className="text-center space-y-6 py-4">
                                            <h2 className="text-xl font-typewriter uppercase">Case Verdict</h2>
                                            <p className="text-xs text-zinc-500 italic px-8 leading-relaxed">"The Commissioner is waiting. One name, Srijan. Make it count."</p>
                                            <div className="grid grid-cols-2 gap-3">
                                                {crimeScene.suspects.map(s => (
                                                    <button 
                                                        key={s.id} 
                                                        onClick={() => setActiveUI(s.isKiller ? 'win' : 'lose')} 
                                                        className={`p-4 rounded-2xl border transition-all font-bold uppercase text-[9px] tracking-widest shadow-lg ${hasConfessed[s.id] ? 'bg-red-600/20 border-red-600 text-red-500 hover:bg-red-600 hover:text-white' : 'bg-zinc-900/40 border-zinc-800 text-zinc-700 opacity-50 cursor-not-allowed'}`}
                                                        disabled={!hasConfessed[s.id]}
                                                    >
                                                        {formatVal(s.name)}
                                                    </button>
                                                ))}
                                            </div>
                                            <p className="text-[8px] text-zinc-700 uppercase">Note: Accusations only valid for suspects with evidence.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {(activeUI === 'win' || activeUI === 'lose') && (
                        <div className="absolute inset-0 z-[100] bg-black flex flex-col items-center justify-center text-center p-10 animate-fade-in">
                            <h2 className={`text-6xl font-typewriter mb-6 ${activeUI === 'win' ? 'text-amber-500' : 'text-red-600'}`}>
                                {activeUI === 'win' ? 'CONVICTION SECURED' : 'CASE DISMISSED'}
                            </h2>
                            <p className="text-zinc-500 text-lg max-w-xl mb-12 leading-relaxed font-sans">
                                {activeUI === 'win' 
                                    ? "Detective Srijan Das, you nailed it. The killer is in custody and justice is served." 
                                    : "You missed the mark. The perpetrator has escaped, and the case of the Manor remains a whisper in the wind."}
                            </p>
                            <button onClick={() => window.location.reload()} className="bg-zinc-100 text-black px-10 py-4 rounded-2xl font-bold uppercase text-xs tracking-widest shadow-xl hover:bg-white transition-colors">Reconstruct Simulation</button>
                        </div>
                    )}
                </div>
            );
        }

        function LoadingScreen({ status, onStart }) {
            return (
                <div className="fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center p-6 z-50 text-center font-sans">
                    <div className="max-w-md w-full space-y-8 animate-fade-in">
                        <h1 className="text-4xl font-typewriter text-amber-500 mb-2 uppercase tracking-[0.2em]">Manor of Whispers</h1>
                        <div className="bg-zinc-900 p-8 rounded-[2rem] border border-zinc-800 shadow-2xl space-y-6">
                            {status === 'initializing' ? (
                                <div className="space-y-4">
                                    <p className="text-zinc-400 text-sm leading-relaxed font-bold uppercase tracking-widest">Awaiting Detective Srijan Das</p>
                                    <button onClick={onStart} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-5 rounded-2xl transition-all uppercase text-xs tracking-widest shadow-lg shadow-amber-900/20">
                                        Engage Simulation
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="w-8 h-8 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto shadow-[0_0_10px_rgba(245,158,11,0.5)]" />
                                    <p className="font-typewriter text-amber-500 text-xs animate-pulse uppercase tracking-widest">Building Suspect Profiles & Geometry...</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
