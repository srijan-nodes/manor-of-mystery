<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manor of Whispers - Ollama Detective Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e5e5e5; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            ShieldAlert: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Cpu: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1V4M15 1V4M9 20V23M15 20V23M20 9H23M20 14H23M1 9H4M1 14H4"/></svg>,
            Loader2: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            BookOpen: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Send: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
        };

        const MODEL_NAME = "mistral:7b"; 
        const OLLAMA_URL = "http://localhost:11434/api/chat";

        const CHARACTERS = [
    {
        id: 'vivian',
        name: 'Lady Vivian',
        role: 'The Widow',
        avatar: 'bg-purple-900',
        desc: 'Arthur\'s wife. Haughty, defensive, and seemingly unbothered by her husband\'s death.',
        systemPrompt: `
            You are Lady Vivian Pennyworth. You are the MURDERER. 
            You killed Arthur because he discovered your affair with Thomas and was planning to disinherit you tomorrow morning.

            Guidelines:
            1. You claim you were in the rose garden alone at 10 PM.
            2. If asked about the affair or "Thomas", admit to the romance but swear you loved Arthur too much to hurt him.
            3. You are trying to frame Robert. Mention that Arthur and Robert had a "violent shouting match" about money earlier that evening.
            4. CRITICAL: You will only confess to the murder if the detective mentions the "Revised Will" or "Poisoned Sherry". 
            5. Keep responses concise (under 3 sentences).
        `
    },
    {
        id: 'james',
        name: 'James',
        role: 'The Butler',
        avatar: 'bg-slate-700',
        desc: 'The loyal family butler. Nervous, fidgety, and knows more than he lets on.',
        systemPrompt: `
            You are James, the nervous butler. You are innocent, but terrified because you saw something you shouldn't have.
            
            Guidelines:
            1. You are very respectful ("Sir" or "Detective") but your hands shake (mention this in descriptions).
            2. If asked about the night of the murder, say you were cleaning the dining hall.
            3. CRITICAL: You saw Lady Vivian cleaning a dark stain off her silk dress at 11 PM. You will only reveal this if the detective asks about "the dress", "stains", or "Vivian's behavior".
            4. If the detective mentions "Thomas", you whisper that you saw them arguing near the shed.
            5. Keep responses concise.
        `
    },
    {
        id: 'robert',
        name: 'Robert Sterling',
        role: 'The Partner',
        avatar: 'bg-amber-900',
        desc: 'Arthur\'s business partner. Confident, arrogant, and aggressive.',
        systemPrompt: `
            You are Robert Sterling. You are innocent of murder, but you ARE guilty of embezzling funds.
            Because of your theft, you are acting extremely guilty and suspicious.

            Guidelines:
            1. Be aggressive. Tell the detective to stop wasting your time.
            2. Claim you were in the study with Arthur until 9:30 PM, then went straight to your hotel.
            3. If the detective mentions "money" or "theft", get very defensive and threaten to call your lawyer.
            4. You suspect Vivian. You saw her hiding a small glass vial in the grandfather clock. You will only mention the "Vial" or "Grandfather Clock" if the detective asks about "hidden items" or "the clock".
            5. Mock the detective's intelligence frequently.
        `
    }
];

        function App() {
            const [isReady, setIsReady] = useState(false);
            const [connectionError, setConnectionError] = useState(null);
            const [activeCharId, setActiveCharId] = useState('vivian');
            const [conversations, setConversations] = useState({ vivian: [], james: [], robert: [] });
            const [userInput, setUserInput] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            const chatEndRef = useRef(null);

            // Check connection to Ollama on mount
            useEffect(() => {
                const checkOllama = async () => {
                    try {
                        const res = await fetch("http://localhost:11434/api/tags");
                        if (res.ok) setIsReady(true);
                        else throw new Error("Ollama server not responding properly.");
                    } catch (e) {
                        setConnectionError("Could not connect to Ollama. Ensure it's running with OLLAMA_ORIGINS='*'.");
                    }
                };
                checkOllama();
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [conversations, activeCharId, isGenerating]);

            const activeChar = CHARACTERS.find(c => c.id === activeCharId);

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!userInput.trim() || isGenerating) return;

                const text = userInput;
                setUserInput("");
                const userMsg = { role: 'user', content: text };
                
                setConversations(prev => ({
                    ...prev,
                    [activeCharId]: [...prev[activeCharId], userMsg]
                }));

                setIsGenerating(true);

                try {
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL_NAME,
                            messages: [
                                { role: 'system', content: activeChar.systemPrompt },
                                ...conversations[activeCharId],
                                userMsg
                            ],
                            stream: false
                        })
                    });

                    if (!response.ok) throw new Error("Ollama error");

                    const data = await response.json();
                    const replyContent = data.message.content;

                    setConversations(prev => ({
                        ...prev,
                        [activeCharId]: [...prev[activeCharId], userMsg, { role: 'assistant', content: replyContent }]
                    }));
                } catch (err) {
                    setConversations(prev => ({
                        ...prev,
                        [activeCharId]: [...prev[activeCharId], { role: 'assistant', content: "Error connecting to local Mistral. Is Ollama running?" }]
                    }));
                } finally {
                    setIsGenerating(false);
                }
            };

            if (connectionError) {
                return (
                    <div className="h-screen bg-zinc-950 flex flex-col items-center justify-center p-10 text-center">
                        <Icons.ShieldAlert className="text-red-500 w-16 h-16 mb-4" />
                        <h1 className="text-2xl font-typewriter text-white mb-2">Connection Error</h1>
                        <p className="text-zinc-500 max-w-md mb-6">{connectionError}</p>
                        <button onClick={() => window.location.reload()} className="bg-amber-600 px-6 py-2 rounded font-bold">Retry</button>
                    </div>
                );
            }

            if (!isReady) {
                return (
                    <div className="h-screen bg-zinc-950 flex flex-col items-center justify-center p-10 text-center">
                        <Icons.Loader2 className="animate-spin text-amber-500 w-16 h-16 mb-4" />
                        <h1 className="text-2xl font-typewriter text-white">Connecting to Ollama...</h1>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-zinc-950 overflow-hidden">
                    {/* SIDEBAR */}
                    <div className="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col hidden md:flex">
                        <div className="p-6 border-b border-zinc-800">
                            <h2 className="text-xl font-typewriter text-amber-500 font-bold tracking-wider">SUSPECTS</h2>
                            <p className="text-xs text-zinc-500 mt-1">Srijan's Case #2025</p>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {CHARACTERS.map(char => (
                                <button key={char.id} onClick={() => setActiveCharId(char.id)}
                                    className={`w-full text-left p-3 rounded-lg border transition-all flex items-center gap-3 ${
                                        activeCharId === char.id ? 'bg-amber-900/30 border-amber-600/50' : 'bg-zinc-800/50 border-zinc-800 hover:bg-zinc-800'
                                    }`}>
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white ${char.avatar}`}>
                                        {char.name[0]}
                                    </div>
                                    <div>
                                        <div className={`font-bold text-sm ${activeCharId === char.id ? 'text-amber-500' : 'text-zinc-300'}`}>{char.name}</div>
                                        <div className="text-xs text-zinc-500">{char.role}</div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* MAIN CHAT */}
                    <div className="flex-1 flex flex-col relative bg-gradient-to-br from-zinc-900 to-zinc-950">
                        <div className="h-16 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur flex items-center justify-between px-6 z-10">
                            <div className="flex items-center gap-3 font-typewriter text-xl text-zinc-200">
                                Interrogation Room
                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-900/40 text-amber-500 border border-amber-900/50">LOCAL</span>
                            </div>
                            <div className="text-zinc-500 text-xs font-mono flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                MISTRAL 7B READY
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                            {conversations[activeCharId].length === 0 && (
                                <div className="text-center mt-20 opacity-50 animate-fade-in">
                                    <div className={`w-20 h-20 mx-auto rounded-full ${activeChar.avatar} flex items-center justify-center text-3xl font-bold text-white mb-4`}>
                                        {activeChar.name[0]}
                                    </div>
                                    <h2 className="text-2xl font-typewriter text-zinc-300 mb-2">{activeChar.name}</h2>
                                    <p className="text-sm text-zinc-500 max-w-md mx-auto">{activeChar.desc}</p>
                                </div>
                            )}
                            {conversations[activeCharId].map((msg, idx) => (
                                <div key={idx} className={`flex w-full mb-4 ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                    <div className={`max-w-[80%] flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                                        <span className="text-xs text-zinc-500 mb-1 font-typewriter">{msg.role === 'user' ? 'Detective Srijan' : activeChar.name}</span>
                                        <div className={`px-4 py-3 rounded-2xl shadow-md text-sm leading-relaxed ${msg.role === 'user' ? 'bg-amber-700 text-white rounded-tr-sm' : 'bg-zinc-800 text-zinc-200 border border-zinc-700 rounded-tl-sm'}`}>
                                            {msg.content}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {isGenerating && (
                                <div className="flex w-full mb-4 justify-start animate-fade-in">
                                    <div className="px-4 py-3 bg-zinc-800 rounded-2xl rounded-tl-sm flex gap-1 items-center h-10 border border-zinc-700">
                                        <div className="w-2 h-2 bg-zinc-500 rounded-full typing-dot"></div>
                                        <div className="w-2 h-2 bg-zinc-500 rounded-full typing-dot"></div>
                                        <div className="w-2 h-2 bg-zinc-500 rounded-full typing-dot"></div>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        <div className="p-4 bg-zinc-900 border-t border-zinc-800">
                            <form onSubmit={handleSendMessage} className="relative max-w-4xl mx-auto flex gap-2">
                                <input type="text" value={userInput} onChange={(e) => setUserInput(e.target.value)}
                                    placeholder={`Question ${activeChar.name}...`}
                                    className="flex-1 bg-zinc-800 text-zinc-100 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600"
                                    disabled={isGenerating} />
                                <button type="submit" disabled={isGenerating || !userInput.trim()}
                                    className="bg-amber-600 hover:bg-amber-700 disabled:opacity-50 text-white rounded-lg px-4 transition-colors">
                                    <Icons.Send size={20} />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
