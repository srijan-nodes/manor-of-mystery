<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor of Whispers - Procedural Mystery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0c0c0e; color: #e5e5e5; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MODEL_NAME ="llama3.1:latest" ;
        const OLLAMA_URL = "http://127.0.0.1:11434/api/chat";

        const Icons = {
            Send: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Loader: (p) => <svg {...p} className="animate-spin" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            File: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        };

        function App() {
            const [gameState, setGameState] = useState('connecting'); // connecting, generating, playing, error
            const [gameCase, setGameCase] = useState(null);
            const [activeCharId, setActiveCharId] = useState('vivian');
            const [conversations, setConversations] = useState({ vivian: [], james: [], robert: [] });
            const [evidence, setEvidence] = useState([]);
            const [userInput, setUserInput] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            const chatEndRef = useRef(null);

            const CHARACTERS = [
                { id: 'vivian', name: 'Lady Vivian', role: 'The Widow', avatar: 'bg-purple-900', desc: 'The grieving wife.' },
                { id: 'james', name: 'James', role: 'The Butler', avatar: 'bg-slate-700', desc: 'The nervous servant.' },
                { id: 'robert', name: 'Robert Sterling', role: 'The Partner', avatar: 'bg-amber-900', desc: 'The business associate.' }
            ];

            useEffect(() => {
                const initGame = async () => {
                    try {
                        // 1. Check Ollama Connection
                        const check = await fetch("http://localhost:11434/api/chat");
                        if (!check.ok) throw new Error("Ollama offline");
                        
                        // 2. Generate Plot
                        setGameState('generating');
                        const prompt = `Create a murder mystery case for a game. 
                        Victim: Arthur Pennyworth. 
                        Suspects: Lady Vivian (Widow), James (Butler), Robert Sterling (Business Partner).
                        Provide a JSON response with:
                        - "killer": name of the suspect who did it
                        - "weapon": the murder weapon
                        - "motive": the reason for the murder
                        - "vivian_secret": a secret Lady Vivian is hiding (unrelated to murder unless she is the killer)
                        - "james_secret": a secret James is hiding
                        - "robert_secret": a secret Robert is hiding
                        - "clue_trigger": a specific keyword or phrase that would make the killer confess.
                        Return ONLY JSON.`;

                        const res = await fetch(OLLAMA_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: MODEL_NAME,
                                messages: [{ role: 'user', content: prompt }],
                                stream: false,
                                format: "json"
                            })
                        });

                        const data = await res.json();
                        const parsedCase = JSON.parse(data.message.content);
                        setGameCase(parsedCase);
                        setGameState('playing');
                    } catch (e) {
                        setGameState('error');
                        console.error(e);
                    }
                };
                initGame();
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [conversations, activeCharId, isGenerating]);

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!userInput.trim() || isGenerating) return;

                const text = userInput;
                const char = CHARACTERS.find(c => c.id === activeCharId);
                setUserInput("");
                
                const newConversations = { ...conversations };
                newConversations[activeCharId] = [...conversations[activeCharId], { role: 'user', content: text }];
                setConversations(newConversations);

                setIsGenerating(true);

                // Build Dynamic System Prompt based on the generated case
                const systemPrompt = `You are ${char.name}, ${char.role} in Pennyworth Manor. 
                The facts of this specific case are:
                - Arthur Pennyworth was killed with a ${gameCase.weapon}.
                - The motive was ${gameCase.motive}.
                - The actual killer is ${gameCase.killer}.
                - Your personal secret is: ${gameCase[activeCharId + '_secret']}.
                
                Rules:
                1. If you are the killer, deny it aggressively unless the player mentions "${gameCase.clue_trigger}".
                2. If you are not the killer, you are suspicious of the others.
                3. Always stay in character. Keep responses under 3 sentences.`;

                try {
                    const response = await fetch(OLLAMA_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: MODEL_NAME,
                            messages: [{ role: 'system', content: systemPrompt }, ...newConversations[activeCharId]],
                            stream: false
                        })
                    });

                    const data = await response.json();
                    const reply = data.message.content;

                    setConversations(prev => ({
                        ...prev,
                        [activeCharId]: [...prev[activeCharId], { role: 'assistant', content: reply }]
                    }));

                    // Logical Evidence Extraction
                    if (reply.toLowerCase().includes(gameCase.clue_trigger.toLowerCase())) {
                        setEvidence(prev => [...prev, { title: "The Confession", detail: `${char.name} broke down and admitted the truth.` }]);
                    }

                } catch (err) {
                    console.error(err);
                } finally {
                    setIsGenerating(false);
                }
            };

            if (gameState === 'connecting') return <div className="h-screen flex items-center justify-center font-typewriter">Establishing connection to local Mistral...</div>;
            if (gameState === 'generating') return <div className="h-screen flex items-center justify-center font-typewriter animate-pulse">Mistral is writing a new mystery for you, Srijan...</div>;
            if (gameState === 'error') return <div className="h-screen flex flex-col items-center justify-center font-typewriter text-red-500">Ollama connection failed. Run with OLLAMA_ORIGINS="*"<button onClick={() => window.location.reload()} className="mt-4 text-white underline">Retry</button></div>;

            const activeChar = CHARACTERS.find(c => c.id === activeCharId);

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col p-6">
                        <h1 className="text-amber-500 font-typewriter text-xl mb-1">MANOR OF WHISPERS</h1>
                        <p className="text-[10px] text-zinc-500 mb-8 uppercase tracking-widest font-bold">Procedural Case #{(Math.random()*1000).toFixed(0)}</p>
                        
                        <div className="space-y-2 mb-8">
                            <p className="text-[10px] text-zinc-500 uppercase font-bold mb-2">Suspects</p>
                            {CHARACTERS.map(c => (
                                <button key={c.id} onClick={() => setActiveCharId(c.id)} className={`w-full text-left p-2 rounded text-xs transition-all ${activeCharId === c.id ? 'bg-amber-600 text-white' : 'hover:bg-zinc-800 text-zinc-400'}`}>
                                    {c.name}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            <p className="text-[10px] text-zinc-500 uppercase font-bold mb-2">Evidence Folder</p>
                            <div className="space-y-2 text-[11px]">
                                <div className="p-2 border border-zinc-800 rounded text-zinc-500 italic">Victim: Arthur Pennyworth. Weapon: {gameCase.weapon}.</div>
                                {evidence.map((e, i) => (
                                    <div key={i} className="p-2 bg-zinc-800 rounded animate-fade-in border-l-2 border-amber-500">
                                        <b className="block text-amber-500 mb-1">{e.title}</b>
                                        {e.detail}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-1 flex flex-col bg-zinc-950">
                        <div className="h-16 border-b border-zinc-900 flex items-center px-8 bg-zinc-900/30">
                            <div className="font-typewriter text-zinc-400">Questioning: <span className="text-zinc-100">{activeChar.name}</span></div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-8 space-y-6 scrollbar-hide">
                            {conversations[activeCharId].map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                    <div className={`max-w-lg p-3 rounded-lg text-sm ${m.role === 'user' ? 'bg-zinc-100 text-black rounded-br-none' : 'bg-zinc-800 text-zinc-200 rounded-tl-none font-serif italic'}`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {isGenerating && <div className="flex gap-1"><div className="w-1 h-1 bg-zinc-600 rounded-full typing-dot" /><div className="w-1 h-1 bg-zinc-600 rounded-full typing-dot" /><div className="w-1 h-1 bg-zinc-600 rounded-full typing-dot" /></div>}
                            <div ref={chatEndRef} />
                        </div>

                        <form onSubmit={handleSendMessage} className="p-6 bg-zinc-900/50 flex gap-2">
                            <input 
                                className="flex-1 bg-zinc-800 border-none rounded p-3 text-sm focus:ring-1 focus:ring-amber-500 outline-none" 
                                placeholder="Type your question..." 
                                value={userInput} 
                                onChange={e => setUserInput(e.target.value)}
                            />
                            <button className="bg-amber-600 p-3 rounded hover:bg-amber-700 transition-colors"><Icons.Send /></button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
